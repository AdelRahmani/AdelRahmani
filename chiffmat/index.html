<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>ChiffMAT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout : outil de saisie dense aux couleurs d'Usura (charte Eurexo) — en-tête fixe marque + onglets, bandeau de synthèse, cartes et tableaux éditables. */
:root {
  --bg: #F5F4F9; --card: #FFFFFF; --fg: #111016; --muted: #5B5570; --line: #E1DDEC; --line-2: #CFC8E2;
  --brand: #563A95; --brand-ink: #FFFFFF; --brand-soft: #ECE7F6; --brand-hover: #4A3083;
  --blue: #2F7FBA; --blue-soft: #E3F0F9; --green: #4E9B2B; --green-soft: #E7F3DF;
  --violet-c: #563A95; --bleu-c: #3995D1; --vert-c: #80C356;
  --warn: #8A5A00; --warn-bg: #FBF0D5; --err: #B0263A; --err-bg: #FBE3E7;
  --shadow: 0 1px 2px rgba(17, 16, 22, .05), 0 6px 20px rgba(86, 58, 149, .06);
  --font: "Raleway", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Space Grotesk", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100D1A; --card: #181426; --fg: #F3F0FA; --muted: #A9A1C2; --line: #2E2846; --line-2: #3F3760;
    --brand: #A88CE6; --brand-ink: #120E1F; --brand-soft: #2A2143; --brand-hover: #BBA3EE;
    --blue: #6DBDEB; --blue-soft: #16283A; --green: #8FD46A; --green-soft: #1C2D18;
    --warn: #F0C56A; --warn-bg: #3A2E12; --err: #F2A0AE; --err-bg: #421D26;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100D1A; --card: #181426; --fg: #F3F0FA; --muted: #A9A1C2; --line: #2E2846; --line-2: #3F3760;
  --brand: #A88CE6; --brand-ink: #120E1F; --brand-soft: #2A2143; --brand-hover: #BBA3EE;
  --blue: #6DBDEB; --blue-soft: #16283A; --green: #8FD46A; --green-soft: #1C2D18;
  --warn: #F0C56A; --warn-bg: #3A2E12; --err: #F2A0AE; --err-bg: #421D26;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14.5px/1.5 var(--font); margin: 0; font-variant-numeric: lining-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.45rem, 2.6vw, 1.85rem); font-weight: 700; } h2 { font-size: 1.05rem; font-weight: 700; } h3 { font-size: .95rem; }
p { margin: 0; } code { font-size: .85em; background: var(--brand-soft); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--muted); } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num-f { font-family: var(--display); font-variant-numeric: tabular-nums; }

/* ----- En-tête ----- */
.entete { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--card); border-bottom: 1px solid var(--line); }
.entete-row { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding-block: 10px 8px; }
.marque { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--fg); font: inherit; }
.marque-signe { display: grid; grid-template-columns: repeat(3, 6px); gap: 2px; height: 26px; align-items: end; }
.marque-signe i { display: block; border-radius: 2px; }
.marque-signe i:nth-child(1) { background: var(--violet-c); height: 26px; } .marque-signe i:nth-child(2) { background: var(--bleu-c); height: 19px; } .marque-signe i:nth-child(3) { background: var(--vert-c); height: 12px; }
.marque strong { font: 800 1.3rem var(--font); letter-spacing: .3px; color: var(--brand); }
.marque-sous { font-weight: 600; font-size: .86rem; color: var(--muted); padding-left: 12px; border-left: 1px solid var(--line); white-space: nowrap; }
.pick { flex: 1 1 240px; min-width: 0; max-width: 440px; } .pick select { width: 100%; font-weight: 600; }
.liens { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.onglets-row { display: flex; align-items: center; gap: 12px; }
.onglets { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; flex: 1; min-width: 0; padding-block: 2px 8px; }
.onglet { flex: none; display: inline-flex; align-items: center; gap: 7px; font: 600 .86rem var(--font); color: var(--fg); background: transparent; border: 1px solid transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.onglet:hover { background: var(--brand-soft); }
.onglet small { font: 600 .72rem var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.onglet .compte { background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 0 6px; }
.onglet.on { background: var(--brand); color: var(--brand-ink); } .onglet.on small { color: var(--brand-ink); opacity: .85; } .onglet.on .compte { background: rgba(255, 255, 255, .22); color: var(--brand-ink); opacity: 1; }
.mini-total { flex: none; font-size: .78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; padding-bottom: 6px; }
.mini-total b { font: 700 1.05rem var(--display); color: var(--brand); letter-spacing: 0; text-transform: none; margin-left: 6px; font-variant-numeric: tabular-nums; }
.tricolore { height: 3px; background: linear-gradient(90deg, var(--violet-c) 0 33.33%, var(--bleu-c) 33.33% 66.66%, var(--vert-c) 66.66%); }
.bascule-theme .icone-soleil { display: none; }
:root[data-theme="dark"] .bascule-theme .icone-lune { display: none; } :root[data-theme="dark"] .bascule-theme .icone-soleil { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bascule-theme .icone-lune { display: none; } :root:not([data-theme="light"]) .bascule-theme .icone-soleil { display: block; } }

/* ----- Bandeau de synthèse ----- */
.bandeau { padding-block: 18px 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr); gap: 14px; align-items: stretch; }
.dossier-id { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; box-shadow: var(--shadow); }
.dossier-id .ref { font: 700 1.2rem var(--display); overflow-wrap: anywhere; }
.dossier-id .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; min-width: 0; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; overflow: hidden; box-shadow: var(--shadow); }
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--line-2); }
.kpi span { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.kpi b { font: 700 clamp(1.1rem, 2vw, 1.45rem) var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.total { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); } .kpi.total span { color: var(--brand-ink); opacity: .85; } .kpi.total::before { display: none; }
.kpi.acompte::before { background: var(--violet-c); } .kpi.differe::before { background: var(--bleu-c); } .kpi.recours::before { background: var(--vert-c); }
.etat { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 .74rem var(--font); padding: 3px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); border: 0; letter-spacing: .02em; }
button.chip { cursor: pointer; } button.chip:hover { filter: brightness(.96); }
.chip.gamme { background: var(--brand); color: var(--brand-ink); text-transform: uppercase; letter-spacing: .08em; }
.chip.neutre { background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.chip.warn { background: var(--warn-bg); color: var(--warn); } .chip.err { background: var(--err-bg); color: var(--err); } .chip.ok { background: var(--green-soft); color: var(--green); }

/* ----- Contenu ----- */
main { padding-block: 22px 64px; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 20px; flex-wrap: wrap; }
.head > div:first-child { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.head .eyebrow { font-size: .76rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); }
.head p.muted { max-width: 82ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 18px; align-items: start; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { font: 700 .86rem var(--font); border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 8px 14px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); } .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: var(--brand-ink); }
.btn.ghost { background: transparent; } .btn.sm { padding: 6px 11px; font-size: .8rem; border-radius: 8px; }
.btn.icone { padding: 6px 8px; } .btn svg { width: 16px; height: 16px; }
.btn.danger { color: var(--err); } .btn.danger:hover { border-color: var(--err); }
.btn.dashed { border-style: dashed; background: transparent; color: var(--brand); }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 5px 7px; border-radius: 6px; }
.x:hover { color: var(--err); background: var(--err-bg); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
textarea { width: 100%; min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 3px var(--brand-soft); }
input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--brand); }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 12px 14px; }
.form label { display: flex; flex-direction: column; gap: 5px; font-size: .8rem; color: var(--muted); font-weight: 700; }
.form label.wide { grid-column: 1 / -1; }
.form label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--fg); font-size: .88rem; font-weight: 600; }
.form .hint { font-weight: 500; font-size: .75rem; }

/* ----- Tableaux ----- */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; background: var(--card); white-space: nowrap; padding-block: 10px; border-bottom: 1px solid var(--line-2); }
td.num, th.num { text-align: right; white-space: nowrap; }
tbody tr:hover td { background: color-mix(in srgb, var(--brand-soft) 45%, transparent); }
td input, td select { width: 100%; padding: 5px 7px; border-color: transparent; background: transparent; border-radius: 6px; }
td input:hover, td select:hover { border-color: var(--line-2); background: var(--card); }
td input:focus, td select:focus { background: var(--card); }
td input.n { text-align: right; font-variant-numeric: tabular-nums; } td input::placeholder { color: var(--blue); font-style: italic; opacity: .9; }
tr.grp td { background: var(--brand-soft); padding-block: 9px; border-bottom: 0; }
tr.grp:hover td { background: var(--brand-soft); }
.grp-t { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
.grp-t b { color: var(--brand); font-weight: 800; }
.tag { font: 700 .7rem var(--font); padding: 2px 8px; border-radius: 999px; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
.tag.recup { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.tag.plaf { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 35%, transparent); }
tr.sub td { font-weight: 700; background: var(--bg); }
tr.sub:hover td { background: var(--bg); }
tr.tot td { font: 700 1rem var(--display); border-top: 2px solid var(--brand); background: var(--card); }
tr.tot:hover td { background: var(--card); }
tr.off td { opacity: .5; }
.c-des { min-width: 330px; } .c-unit { width: 104px; min-width: 104px; } .c-sm { width: 84px; min-width: 84px; } .c-num { width: 108px; min-width: 108px; } .c-md { min-width: 132px; } .c-sel { min-width: 200px; }
.strong { font-weight: 800; } .brand { color: var(--brand); }
.flag { font-size: .72rem; color: var(--muted); display: block; font-weight: 500; }
.ajout-rub { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border: 1px dashed var(--line-2); border-radius: 12px; background: var(--card); }
.ajout-rub > span { font-weight: 700; font-size: .82rem; color: var(--muted); margin-right: 4px; }

/* ----- Récapitulatif ----- */
.repart { display: flex; flex-direction: column; gap: 8px; }
.repart-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
.repart-bar i { display: block; height: 100%; }
.repart-bar .a { background: var(--violet-c); } .repart-bar .d { background: var(--bleu-c); } .repart-bar .r { background: var(--vert-c); }
.legende { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .84rem; color: var(--muted); font-weight: 600; }
.legende span { display: inline-flex; align-items: center; gap: 6px; } .legende i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-variant-numeric: tabular-nums; margin: 0; } .kv dt { color: var(--muted); font-weight: 500; } .kv dd { margin: 0; text-align: right; font-weight: 700; }
.alertes { border-radius: 16px; padding: 14px 18px; background: var(--warn-bg); color: var(--warn); display: flex; flex-direction: column; gap: 6px; }
.alertes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-weight: 500; }
.note-info { padding: 12px 14px; border-radius: 12px; background: var(--blue-soft); color: var(--fg); font-size: .88rem; }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-family: var(--display); margin-bottom: 4px; }
.regles { margin: 0; padding-left: 18px; color: var(--muted); font-size: .86rem; display: flex; flex-direction: column; gap: 3px; }

dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--card); color: var(--fg); width: min(780px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 20px 60px rgba(17, 16, 22, .25); }
dialog::backdrop { background: rgba(16, 13, 26, .5); }
dialog form { display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; max-height: calc(100vh - 50px); }
dialog .scroll { overflow: auto; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 12px; }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1080px) { .bandeau { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .entete { position: static; }
  .marque-sous, .mini-total { display: none; }
  .liens { margin-left: 0; width: 100%; } .liens .btn:not(.icone) { flex: 1 1 auto; justify-content: center; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .entete, .noprint, .x, .bandeau { display: none !important; }
  body { background: #fff; color: #000; } .card, .tw { box-shadow: none; border-color: #999; }
  main { padding: 0; }
}
</style>
<header class="entete">
  <div class="wrap entete-row">
    <button class="marque" type="button" data-act="tab" data-v="dossier" aria-label="ChiffMAT, retour au dossier">
      <span class="marque-signe" aria-hidden="true"><i></i><i></i><i></i></span>
      <strong>ChiffMAT</strong><span class="marque-sous">Chiffrage des dommages</span>
    </button>
    <label class="pick"><span class="sr">Dossier ouvert</span><select id="dossier-pick" aria-label="Dossier ouvert"></select></label>
    <div class="liens">
      <button class="btn sm primary" type="button" data-act="new">Nouveau dossier</button>
      <button class="btn sm" type="button" data-act="dup">Dupliquer</button>
      <button class="btn sm" type="button" data-act="import-json">Importer</button>
      <button class="btn sm" type="button" data-act="export-json">Exporter</button>
      <button class="btn sm icone bascule-theme" type="button" id="theme" data-act="theme" aria-label="Changer de thème" title="Changer de thème">
        <svg class="icone-lune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icone-soleil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <div class="wrap onglets-row">
    <nav class="onglets" id="tabs" aria-label="Sections du chiffrage"></nav>
    <p class="mini-total" id="mini-total" aria-live="polite"></p>
  </div>
  <div class="tricolore" aria-hidden="true"></div>
</header>
<section class="wrap bandeau" id="strip" aria-label="Synthèse du dossier"></section>
<main class="wrap" id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<input type="file" id="file-csv" accept=".csv,text/csv,text/plain" hidden>

<script>
/* Référentiel IMH : gammes de contrat, plafonds, catégories, barème d'articles normalisés.
   Source : classeurs « CHIFFRAGE DOMMAGES VIERGE <GAMME>.xlsx », supports de chiffrage IMH 2018
   et grille « Estimation et vétusté des biens mobiliers, gamme 2017 socle et options ».
   Plafond : {eur} montant fixe · {pct, max?} part du capital mobilier souscrit (plafonnée à max) ·
   {field} montant saisi sur le dossier · null : pas de plafond. */
const IMHData = (() => {
  const STD_RUB = [
    { id: "hab-tce", label: "Locaux d'habitation · Bâtiment TCE", corps: "immo", recup: true },
    { id: "hab-emb", label: "Locaux d'habitation · Embellissements", corps: "emb", recup: true },
    { id: "dep", label: "Dépendances", corps: "immo", recup: false },
    { id: "clo", label: "Clôtures, murs de clôture, portails", corps: "immo", recup: false },
  ];
  const NATURE_RUB = [
    { id: "mh-rep", label: "Réparation du mobil-home", corps: "immo", recup: false, plafond: { field: "valeurOccasionMH" }, note: "Dans la limite de la valeur de remplacement sur le marché de l'occasion" },
    { id: "mh-rem", label: "Remplacement du mobil-home (valeur d'occasion, accessoires intégrés)", corps: "immo", recup: false },
    { id: "mh-frais", label: "Frais d'enlèvement, démolition, réinstallation, raccordement", corps: "immo", recup: false, plafond: { eur: 3000 }, note: "Sur factures" },
    { id: "mh-dep", label: "Dépendances, abri de jardin et leurs frais de démolition", corps: "immo", recup: false, plafond: { eur: 5000 } },
  ];

<script>
/* Moteur de calcul du chiffrage IMH, sans dépendance au navigateur.
   Reprend les formules des classeurs « CHIFFRAGE DOMMAGES <GAMME> » :
   valeur à neuf = Q × PU ; vétusté = VAN × taux ; VVD = VAN − vétusté ;
   vétusté récupérable = VAN × min(taux, 25 %) sur les locaux d'habitation ;
   aménagements extérieurs = min(VVD TTC, plafond) ; mobilier selon la catégorie. */
const IMH = (() => {
  const R = typeof IMHData !== "undefined" ? IMHData : require("./gammes.js");
  const num = (v) => { const n = parseFloat(String(v == null ? "" : v).replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
  const blank = (v) => v == null || String(v).trim() === "";
  const r2 = (x) => Math.round((x + Number.EPSILON) * 100) / 100;
  const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);

  function plafondValue(p, d) {
    if (!p) return Infinity;
    if (p.eur != null) return p.eur;
    if (p.pct != null) { const cap = num(d.capitalMobilier); const v = cap > 0 ? cap * p.pct : Infinity; return p.max != null ? Math.min(v, p.max) : v; }
    if (p.field) { const v = num(d[p.field]); return v > 0 ? v : Infinity; }
    return Infinity;
  }
  function plafondLabel(p) {
    if (!p) return "Sans plafond";
    if (p.eur != null) return `${p.eur.toLocaleString("fr-FR")} €`;
    if (p.pct != null) return `${Math.round(p.pct * 100)} % du capital mobilier${p.max != null ? `, ${p.max.toLocaleString("fr-FR")} € au plus` : ""}`;
    if (p.field === "valeurOccasionMH") return "Valeur d'occasion du mobil-home";
    return "";
  }

  /* Âge en années révolues entre la date d'achat et la date de référence (sinistre). */
  function ageYears(achat, ref) {
    if (blank(achat)) return null;
    const a = new Date(achat), r = blank(ref) ? new Date() : new Date(ref);
    if (isNaN(a) || isNaN(r)) return null;
    let y = r.getFullYear() - a.getFullYear();
    if (r.getMonth() < a.getMonth() || (r.getMonth() === a.getMonth() && r.getDate() < a.getDate())) y--;
    return Math.max(0, y);
  }

  /* Taux de vétusté proposé (en %), ou null quand il s'apprécie de gré à gré. */
  function suggestVet(cat, age, grille) {
    if (!cat || cat.kind === "occasion") return 0;
    if (age == null) return null;
    const y = age + 1; // « 1re année » = moins d'un an
    if (!grille || grille === "contrat") {
      if (cat.kind !== "neuf") return null;
      return age < (cat.seuil == null ? 0 : cat.seuil) ? 0 : Math.min(80, 10 * age);
    }
    const opt = grille.replace("2017-", "");
    if (cat.fam === "vet") return [0, 40, 60][y - 1] ?? 80;
    if (cat.fam === "equip") { if (opt === "illimite") return 0; if (opt === "5ans" && y <= 5) return 0; return Math.min(80, 10 * (y - 1)); }
    if (cat.fam === "info") { if (opt === "illimite") return 0; if (opt === "5ans") return y <= 5 ? 0 : 80; return Math.min(80, 20 * (y - 1)); }
    return null;
  }

  function newDossier() {
    return { id: "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ref: "", assure: "", dateSinistre: "", dateExpertise: "", cabinet: "", collaborateur: "",
      gamme: "CONFIANCE", zone: "1", capitalMobilier: "", franchise: "", franchiseRecours: false, valeurOccasionMH: "", grilleMob: "contrat", observations: "",
      immo: [], mob: [], autres: [], amen: [], ng: [] };
  }

  /* ----- Immobilier ----- */
  function immoLine(l, rub, g) {
    const van = num(l.q) * num(l.pu), t = num(l.vet) / 100;
    const vet = van * t, vvd = van - vet;
    const recup = rub && rub.recupOk ? van * Math.min(t, g.recupMax) : 0;
    const tvaRate = l.real === "po" ? 0 : num(l.tva) / 100;
    const tvaVvd = vvd * tvaRate, tvaRecup = recup * tvaRate, tva = tvaVvd + tvaRecup;
    const total = vvd + recup + tva;
    let acompte, differe;
    if (l.real === "ag") { acompte = 0; differe = total; }
    else if (l.real === "fo" || l.real === "po") { acompte = vvd + tvaVvd; differe = recup + tvaRecup; }
    else { acompte = vvd; differe = recup + tva; }
    return { van, vet, vvd, recup, nonRecup: vet - recup, tva, tvaRate, total, acompte, differe, vvdTtc: vvd + tvaVvd };
  }

  function compute(d) {
    const g = R.gammes[d.gamme] || R.gammes.CONFIANCE;
    const alertes = [], depassements = [];
    const fix = (o) => { for (const k in o) if (typeof o[k] === "number") o[k] = r2(o[k]); return o; };

    // Immobilier
    const immoLines = {}, rubs = g.rubriques.map((r) => ({ ...r, recupOk: r.recup, van: 0, vet: 0, vvd: 0, recup: 0, nonRecup: 0, tva: 0, total: 0, n: 0 }));
    const byRub = Object.fromEntries(rubs.map((r) => [r.id, r]));
    const payImmo = { ag: [0, 0], as: [0, 0], na: [0, 0] };
    d.immo.forEach((l, i) => {
      const rub = byRub[l.rub];
      if (!rub) { alertes.push(`Immobilier, ligne ${i + 1} : rubrique absente de la gamme ${g.label}, ligne non comptée.`); immoLines[l.id] = { excluded: true }; return; }
      const c = immoLine(l, rub, g); immoLines[l.id] = c; rub.n++;
      for (const k of ["van", "vet", "vvd", "recup", "nonRecup", "tva", "total"]) rub[k] += c[k];
      if (num(l.pu) === 0 && !blank(l.des)) alertes.push(`Immobilier, « ${l.des} » : prix unitaire à saisir.`);
    });
    for (const r of rubs) {
      r.plafondVal = plafondValue(r.plafond, d);
      r.retenu = Math.min(r.total, r.plafondVal); r.ratio = r.total > 0 ? r.retenu / r.total : 1; r.depass = r.total - r.retenu;

  const row = (sec, l, res) => { const calc = res[sec].lines[l.id] || {}; return `<tr class="${calc.excluded ? "off" : ""}">${COLS[sec].map((c) => cell(sec, l, c, calc)).join("")}<td><button class="x" type="button" data-act="del-line" data-sec="${sec}" data-id="${l.id}" title="Supprimer la ligne" aria-label="Supprimer la ligne">×</button></td></tr>`; };
  const thead = (sec) => `<thead><tr>${COLS[sec].map((c) => `<th class="${c.out || c.type === "num" ? "num" : ""}">${h(c.label)}</th>`).join("")}<th></th></tr></thead>`;

  /* ----- Valeurs calculées mises à jour pendant la saisie ----- */
  function outMap(res) {
    const d = cur(), m = {};
    for (const sec of Object.keys(COLS)) for (const l of d[sec]) { const calc = res[sec].lines[l.id] || {}; for (const c of COLS[sec]) if (c.out) m[`${sec}:${l.id}:${c.k}`] = c.out(calc, l); }
    for (const r of res.immo.rubriques) for (const k of ["van", "vvd", "recup", "total", "retenu"]) m[`rub:${r.id}:${k}`] = eur0(r[k]);
    for (const c of res.mob.cats) { m[`mc:${c.id}:valeur`] = eur0(c.valeur); m[`mc:${c.id}:total`] = eur0(c.total); }
    res.mob.groupes.forEach((p, i) => { m[`mg:${i}:total`] = eur0(p.total); m[`mg:${i}:retenu`] = eur(p.retenu); });
    for (const a of res.amen.cats) { m[`ac:${a.id}:ttc`] = eur0(a.ttc); m[`ac:${a.id}:retenu`] = eur(a.retenu); }
    Object.assign(m, { "mob:total": eur(res.mob.total), "mob:retenu": eur(res.mob.retenu), "amen:retenu": eur(res.amen.retenu), "autres:total": eur(res.autres.total), "ng:total": eur(res.ng.total),
      "immo:total": eur(res.immo.corpsTotal.total), "immo:retenu": eur(res.immo.corpsTotal.retenu) });
    return m;
  }
  function refresh() {
    const res = IMH.compute(cur()), m = outMap(res);
    $$("[data-o]").forEach((el) => { const v = m[el.dataset.o]; if (v != null && el.textContent !== v) el.textContent = v; });
    $$("[data-ph]").forEach((el) => { const [sec, id] = el.dataset.ph.split(":"); const c = (res[sec].lines[id] || {}); el.placeholder = c.sugg != null ? `auto ${c.sugg}` : ""; });
    renderStrip(res);
  }

  /* ----- En-tête ----- */
  const TABS = [["dossier", "Dossier"], ["immo", "Immobilier"], ["mob", "Mobilier"], ["autres", "Autres préjudices"], ["amen", "Aménagements ext."], ["ng", "Non garantis"], ["recap", "Récapitulatif"], ["bareme", "Barème IMH"]];
  const tabAmount = (k, res) => ({ immo: res.immo.corpsTotal.retenu, mob: res.mob.retenu, autres: res.autres.total, amen: res.amen.retenu, ng: res.ng.total }[k]);
  function renderStrip(res) {
    const d = cur(), t = res.pay.totals, nA = res.alertes.length, nD = res.depassements.length;
    const dateS = d.dateSinistre ? `Sinistre du ${new Date(d.dateSinistre).toLocaleDateString("fr-FR")}` : "Date du sinistre à saisir";
    $("#strip").innerHTML = `<div class="dossier-id"><span class="ref">${h(d.ref ? "Dossier " + d.ref : "Dossier sans référence")}</span>
        <span class="muted">${h([d.assure, dateS].filter(Boolean).join(" · "))}</span>

          ${nA ? `<button class="chip err" type="button" data-act="tab" data-v="recap">${nA} point${nA > 1 ? "s" : ""} à vérifier</button>` : `<span class="chip ok">Aucun point à vérifier</span>`}</div></div>
      <div class="kpis"><div class="kpi total"><span>Indemnité</span><b>${eur(t.total)}</b></div><div class="kpi acompte"><span>Acompte</span><b>${eur(t.acompte)}</b></div>
        <div class="kpi differe"><span>Différé facture</span><b>${eur(t.differe)}</b></div><div class="kpi recours"><span>Différé recours</span><b>${eur(t.recours)}</b></div></div>`;
    $("#mini-total").innerHTML = `Indemnité<b>${eur(t.total)}</b>`;
    for (const [k] of TABS) { const el = document.querySelector(`[data-tabamt="${k}"]`); if (el) el.textContent = eurK(tabAmount(k, res)); }
  }
  function renderHeader(res) {
    $("#dossier-pick").innerHTML = db.dossiers.map((d) => `<option value="${h(d.id)}"${d.id === db.current ? " selected" : ""}>${h([d.ref || "Sans référence", d.assure].filter(Boolean).join(" · "))}</option>`).join("");
    const d = cur();
    $("#tabs").innerHTML = TABS.map(([k, l]) => { const n = d[k] && d[k].length;
      return `<button class="onglet${ui.tab === k ? " on" : ""}" type="button" data-act="tab" data-v="${k}"${ui.tab === k ? ' aria-current="page"' : ""}>${l}${n ? ` <small class="compte">${n}</small> <small data-tabamt="${k}">${eurK(tabAmount(k, res))}</small>` : ""}</button>`; }).join("");
    renderStrip(res);
  }
  /* Thème clair / sombre, même mémoire que Usura (clé catnat-theme). */
  const THEME_KEY = "catnat-theme";
  try { const t = localStorage.getItem(THEME_KEY); if (t === "clair") document.documentElement.setAttribute("data-theme", "light"); else if (t === "sombre") document.documentElement.setAttribute("data-theme", "dark"); } catch { /* sans stockage */ }
  function toggleTheme() {
    const root = document.documentElement, set = root.getAttribute("data-theme");

    try { localStorage.setItem(THEME_KEY, dark ? "clair" : "sombre"); } catch { /* sans stockage */ }

  /* ----- Écrans ----- */
  const H = (eb, t, txt) => `<section class="head"><div><span class="eyebrow">${eb}</span><h1>${t}</h1><p class="muted">${txt}</p></div>`;
  const field = (f, label, type, extra = "") => {

    if (Array.isArray(type)) return `<label for="${id}">${label}<select ${a} data-rerender>${opts(type, v)}</select>${extra}</label>`;
    return `<label for="${id}">${label}<input ${a} type="${type === "num" ? "text" : type || "text"}"${type === "num" ? ' inputmode="decimal"' : ""} value="${h(v)}">${extra}</label>`;
  };
  function viewDossier() {
    const d = cur(), gm = g();

      ${gm.mobilier.filter((c) => c.kind === "neuf").map((c) => `<dt>${h(c.label)}</dt><dd>${c.seuil === Infinity ? "à neuf illimité" : `pas de vétusté avant ${c.seuil} an${c.seuil > 1 ? "s" : ""}`}</dd>`).join("")}
      ${gm.plafondsMob.map((p) => `<dt>${h(p.label)}</dt><dd>${h(plaf(p.plafond))}</dd>`).join("")}
      ${(gm.amenag || []).map((a) => `<dt>${h(a.label)}</dt><dd>${h(a.plafond ? plaf(a.plafond) : a.note || "Sans plafond")}</dd>`).join("")}
    </dl>`;
    return `<section class="head"><div><span class="eyebrow">Étape 1</span><h1>Dossier</h1><p class="muted">Références du dossier, contrat et paramètres qui pilotent les plafonds et la vétusté.</p></div>

          ${field("franchise", "Franchise (€)", "num")}
          ${d.gamme === "NATURE" ? field("valeurOccasionMH", "Valeur d'occasion du mobil-home (€)", "num", '<span class="hint">Limite la réparation du mobil-home.</span>') : ""}
          ${field("grilleMob", "Barème de vétusté mobilier", R.GRILLES.map((x) => [x.id, x.label]))}
          ${field("franchiseRecours", "Franchise remboursée à l'issue du recours", "check")}
        </div></div>
      </div>
      <div class="card"><div class="card-head"><h2>Ce que prévoit la gamme ${h(gm.label)}</h2><span class="chip gamme">${h(gm.label)}</span></div>${ref}</div>`;
  }

  function viewImmo(res) {
    const d = cur(), gm = g(), known = new Set(gm.rubriques.map((r) => r.id)), ncol = COLS.immo.length + 1;
    const groups = gm.rubriques.map((r) => ({ r, lines: d.immo.filter((l) => l.rub === r.id) })).filter((x) => x.lines.length);
    const orphans = d.immo.filter((l) => !known.has(l.rub));
    const tags = (r) => `${r.recup && gm.recupMax ? '<span class="tag recup">vétusté récupérable</span>' : ""}${r.plafond ? `<span class="tag plaf">plafond ${h(IMH.plafondLabel(r.plafond))}</span>` : ""}${r.note ? `<span class="tag">${h(r.note)}</span>` : ""}`;

        <span class="actions noprint"><button class="btn sm" type="button" data-act="add-line" data-sec="immo" data-v="${r.id}">Ajouter une ligne</button><button class="btn sm ghost" type="button" data-act="bareme-pick" data-v="${r.id}">Depuis le barème</button></span></div></td></tr>
        ${lines.map((l) => row("immo", l, res)).join("")}

    }).join("") + (orphans.length ? `<tr class="grp"><td colspan="${ncol}"><div class="grp-t"><span class="actions"><b>Hors gamme ${h(gm.label)}</b><span class="tag">choisir une rubrique pour compter ces lignes</span></span></div></td></tr>${orphans.map((l) => row("immo", l, res)).join("")}` : "");

    return `${H("Étape 2", "Dommages immobiliers", `Valeur à neuf = Q × PU. Vétusté récupérable limitée à ${gm.recupMax ? gm.recupMax * 100 + " %" : "0 %"} de la valeur à neuf sur les locaux d'habitation. Entrée passe à la ligne suivante.`)}</section>
      ${d.immo.length ? `<div class="tw"><table>${thead("immo")}<tbody>${body}</tbody><tfoot><tr class="tot"><td colspan="11">Total travaux, TTC après travaux</td><td class="num" data-o="immo:total">${eur(res.immo.corpsTotal.total)}</td><td colspan="2"></td></tr></tfoot></table></div>` : `<div class="card empty"><b>Aucun dommage immobilier</b>Ajoutez une ligne dans une rubrique ou reprenez des articles du barème IMH.</div>`}
      ${ajout}`;
  }

  function flatTable(sec, res, addLabel) {

    return `${d[sec].length ? `<div class="tw"><table>${thead(sec)}<tbody>${d[sec].map((l) => row(sec, l, res)).join("")}</tbody></table></div>` : `<div class="card empty"><b>Rien de saisi pour l'instant</b>« ${addLabel} » pour commencer.</div>`}
      <div class="actions noprint"><button class="btn primary" type="button" data-act="add-line" data-sec="${sec}">${addLabel}</button></div>`;
  }
  function viewMob(res) {

    const cats = res.mob.cats.filter((c) => c.n);
    return `<section class="head"><div><span class="eyebrow">Étape 3</span><h1>Dommages mobiliers</h1><p class="muted">Vétusté proposée d'après la date d'achat et la date du sinistre (${h(grille.label.toLowerCase())}), affichée en bleu. Un taux saisi la remplace. Bijoux, objets de valeur et vins en valeur d'occasion.</p></div></section>
      ${flatTable("mob", res, "Ajouter un bien")}
      <div class="grid2">
        <div class="card"><h2>Par catégorie</h2>${cats.length ? `<div class="tw"><table><thead><tr><th>Catégorie</th><th class="num">Valeur</th><th class="num">Indemnité</th></tr></thead><tbody>${cats.map((c) => `<tr><td>${h(c.label)}</td><td class="num" data-o="mc:${c.id}:valeur">${eur0(c.valeur)}</td><td class="num" data-o="mc:${c.id}:total">${eur0(c.total)}</td></tr>`).join("")}</tbody></table></div>` : '<p class="muted">Aucun bien saisi.</p>'}</div>

          <tr class="tot"><td>Mobilier retenu${num(d.capitalMobilier) > 0 ? ` <span class="flag">dans la limite du capital de ${eur(num(d.capitalMobilier))}</span>` : ""}</td><td class="num" data-o="mob:total">${eur(res.mob.total)}</td><td class="num" data-o="mob:retenu">${eur(res.mob.retenu)}</td></tr>

      ${flatTable("autres", res, "Ajouter un préjudice")}`;

  function viewAmen(res) {
    const gm = g();
    return `<section class="head"><div><span class="eyebrow">Étape 5</span><h1>Aménagements extérieurs garantis</h1><p class="muted">Chaque catégorie est retenue en valeur vétusté déduite TTC, dans la limite de son plafond ${h(gm.label)}.</p></div></section>
      ${flatTable("amen", res, "Ajouter une ligne")}
      <div class="card"><h2>Plafonds ${h(gm.label)}</h2><div class="tw"><table><thead><tr><th>Catégorie</th><th>Plafond</th><th class="num">VVD TTC</th><th class="num">Retenu</th></tr></thead><tbody>
        ${res.amen.cats.map((a) => `<tr><td>${h(a.label)}</td><td>${h(a.plafondTxt)}</td><td class="num" data-o="ac:${a.id}:ttc">${eur0(a.ttc)}</td><td class="num" data-o="ac:${a.id}:retenu">${eur(a.retenu)}</td></tr>`).join("")}
        <tr class="tot"><td colspan="3">Aménagements extérieurs retenus</td><td class="num" data-o="amen:retenu">${eur(res.amen.retenu)}</td></tr></tbody></table></div></div>`;
  }
  function viewNg(res) {

  function viewRecap(res) {

    const crow = (label, x, cls = "") => `<tr class="${cls}"><td>${label}</td><td class="num">${eur0(x.van)}</td><td class="num">${eur0(x.vet)}</td><td class="num">${eur0(x.vvd)}</td><td class="num">${eur0(x.recup)}</td><td class="num">${eur0(x.nonRecup)}</td><td class="num">${eur0(x.tva)}</td><td class="num strong">${eur0(x.total)}</td></tr>`;

    const prow = (r) => `<tr><td>${h(r.label)}</td><td class="num">${eur0(r.acompte)}</td><td class="num">${eur0(r.differe)}</td><td class="num">${eur0(r.recours)}</td><td class="num strong">${eur0(r.total)}</td></tr>`;

    const pos = (x) => Math.max(0, x), base = pos(t.acompte) + pos(t.differe) + pos(t.recours) || 1, pc = (x) => `${(pos(x) / base * 100).toFixed(2)}%`;

      <div class="legende"><span><i style="background:var(--violet-c)"></i>Acompte à régler ${eur(t.acompte)}</span><span><i style="background:var(--bleu-c)"></i>Différé à réception de facture ${eur(t.differe)}</span><span><i style="background:var(--vert-c)"></i>Différé à l'issue du recours ${eur(t.recours)}</span></div></div>`;
    return `${H("Synthèse", `Récapitulatif ${h(gm.label)}`, h([d.ref && "Dossier " + d.ref, d.assure, d.dateSinistre && "sinistre du " + new Date(d.dateSinistre).toLocaleDateString("fr-FR")].filter(Boolean).join(" · ")))}
      <div class="actions noprint"><button class="btn primary" type="button" data-act="export-xlsx">Exporter vers Excel</button>${xl}</div></section>
      ${res.alertes.length ? `<div class="alertes"><strong>Points à vérifier avant d'envoyer</strong><ul>${res.alertes.map((a) => `<li>${h(a)}</li>`).join("")}</ul></div>` : ""}
      <div class="card"><div class="card-head"><h2>Règlement</h2><span class="num-f strong brand">${eur(t.total)}</span></div>${repart}<div class="tw"><table><thead><tr><th></th><th class="num">Acompte à régler</th><th class="num">Différé à réception de la facture</th><th class="num">Différé à l'issue du recours</th><th class="num">Total</th></tr></thead>

        if (el.id === "file-csv") { if (dlg().open) dlg().close("no"); importCsv(String(rd.result)); }
        else { try { const j = JSON.parse(String(rd.result)), d = j.dossier || j; if (!Array.isArray(d.immo)) throw new Error(); d.id = IMH.newDossier().id; for (const k of ["mob", "autres", "amen", "ng"]) d[k] = d[k] || []; db.dossiers.push(d); db.current = d.id; save(); render(); toast("Dossier importé."); }
          catch { toast("Ce fichier n'est pas un dossier de chiffrage IMH exporté depuis cet outil."); } }
        el.value = "";
      };
      rd.readAsText(file, "utf-8"); return;
    }
    if (el.dataset && el.dataset.sec && (el.tagName === "SELECT" || el.type === "checkbox")) { setField(el); if (el.dataset.rerender != null || el.dataset.sec === "d") render(); else refresh(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("td input") && !e.isComposing) { // passer à la ligne suivante, même colonne
      const td = e.target.closest("td"), tr = td.closest("tr"), idx = [...tr.children].indexOf(td);
      let next = tr.nextElementSibling; while (next && !next.children[idx]?.querySelector("input:not([disabled])")) next = next.nextElementSibling;
      if (next) { e.preventDefault(); next.children[idx].querySelector("input").focus(); }
    }
  });
  render();
  window.IMHApp = { db: () => db, compute: () => IMH.compute(cur()), render };
})();
</script>
</body>
