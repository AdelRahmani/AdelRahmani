<header class="entete">
  <div class="wrap entete-row">
    <button class="marque" type="button" data-act="tab" data-v="dossier" aria-label="ChiffMAT, retour au dossier">
      <span class="marque-signe" aria-hidden="true"><i></i><i></i><i></i></span>
      <strong>ChiffMAT</strong><span class="marque-sous">Chiffrage des dommages</span>
    </button>
    <label class="pick"><span class="sr">Dossier ouvert</span><select id="dossier-pick" aria-label="Dossier ouvert"></select></label>
    <div class="liens">
      <button class="btn sm primary" type="button" data-act="new">Nouveau dossier</button>
      <button class="btn sm" type="button" data-act="dup">Dupliquer</button>
      <button class="btn sm" type="button" data-act="import-json">Importer</button>
      <button class="btn sm" type="button" data-act="export-json">Exporter</button>
      <button class="btn sm icone bascule-theme" type="button" id="theme" data-act="theme" aria-label="Changer de thème" title="Changer de thème">
        <svg class="icone-lune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icone-soleil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
  <div class="wrap onglets-row">
    <nav class="onglets" id="tabs" aria-label="Sections du chiffrage"></nav>
    <p class="mini-total" id="mini-total" aria-live="polite"></p>
  </div>
  <div class="tricolore" aria-hidden="true"></div>
</header>
<section class="wrap bandeau" id="strip" aria-label="Synthèse du dossier"></section>
<main class="wrap" id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<input type="file" id="file-csv" accept=".csv,text/csv,text/plain" hidden>
