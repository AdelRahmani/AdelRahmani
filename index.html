<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Eureka Chiffrage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout : outil de saisie en une colonne — en-tête fixe, fil d'étapes numérotées (ordre réel du dossier), tableaux denses. */
:root {
  --bg: #f6f4fa; --surface: #ffffff; --surface-2: #efebf6; --ink: #1c054f; --ink-2: #5b5470; --line: #dcd6e8;
  --brand: #4b3a78; --brand-ink: #ffffff; --l1: #615084; --l2: #e4def0; --accent: #2f6fb3;
  --ok: #3f7d14; --ok-bg: #e6f2d6; --warn: #8a5a00; --warn-bg: #fbefcf; --err: #a61b1b; --err-bg: #f8dcdc;
  --mine: #f1ecfa; --shadow: 0 1px 2px rgba(28, 5, 79, .08);
  --font: "Inter", "Segoe UI", system-ui, sans-serif; --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14111d; --surface: #1d1929; --surface-2: #262136; --ink: #ece8f7; --ink-2: #a9a2bd; --line: #38314b;
    --brand: #b9a3ea; --brand-ink: #1a1230; --l1: #4a3d6e; --l2: #2b2540; --accent: #7fb6ee;
    --ok: #a5d67c; --ok-bg: #223318; --warn: #f0c56a; --warn-bg: #3a2e12; --err: #f29a9a; --err-bg: #401c1c;
    --mine: #262040; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14111d; --surface: #1d1929; --surface-2: #262136; --ink: #ece8f7; --ink-2: #a9a2bd; --line: #38314b;
  --brand: #b9a3ea; --brand-ink: #1a1230; --l1: #4a3d6e; --l2: #2b2540; --accent: #7fb6ee;
  --ok: #a5d67c; --ok-bg: #223318; --warn: #f0c56a; --warn-bg: #3a2e12; --err: #f29a9a; --err-bg: #401c1c;
  --mine: #262040; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.55rem; } h2 { font-size: 1.05rem; } h3 { font-size: 1rem; }
p { margin: 0; } small { font-size: .8rem; }
.muted { color: var(--ink-2); } .req { color: var(--err); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.logo { font: 700 1.05rem var(--display); color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.logo i { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); display: inline-block; position: relative; }
.logo i::after { content: ""; position: absolute; inset: 6px 5px; border-top: 2px solid var(--brand-ink); border-bottom: 2px solid var(--brand-ink); }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; color: var(--ink-2); }
.steps { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.step { flex: none; display: flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--ink-2); font: 500 .86rem var(--font); padding: 6px 10px; border-radius: 999px; cursor: pointer; }
.step i { font-style: normal; font-size: .72rem; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.step:hover { background: var(--surface-2); }
.step.on { background: var(--brand); color: var(--brand-ink); } .step.on i { background: var(--brand-ink); color: var(--brand); }

main { padding-block: 20px 56px; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; }
.head > div:first-child { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.head p { max-width: 65ch; }
.actions, .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { font: 600 .86rem var(--font); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.ghost { background: transparent; } .btn.sm { padding: 4px 9px; font-size: .78rem; border-radius: 6px; }
.btn.danger { background: var(--err); border-color: var(--err); color: var(--surface); } .danger-t { color: var(--err); }
.btn:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.link.ln { color: var(--ink); text-decoration-color: var(--line); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.flush { padding: 0; overflow: hidden; } .pad { padding: 14px 16px 0; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 16px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; } .fld.wide { grid-column: 1 / -1; }
.fld > label, .filters .fld > label { font-size: .76rem; font-weight: 600; color: var(--ink-2); letter-spacing: .02em; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; min-width: 0; width: 100%; }
input[type="checkbox"] { width: auto; accent-color: var(--brand); }
input:disabled, select:disabled { background: var(--surface-2); color: var(--ink-2); }
input.num { text-align: right; font-variant-numeric: tabular-nums; min-width: 84px; } input.xs { width: 84px; min-width: 0; }
input.bad { border-color: var(--err); background: var(--err-bg); }
.inline, .ck { display: inline-flex; gap: 8px; align-items: center; font-weight: 500; color: var(--ink); cursor: pointer; }
.checks { display: flex; flex-direction: column; gap: 6px; } .checks label { display: flex; gap: 8px; align-items: baseline; }
.join { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--surface); color: var(--ink-2); font: 600 .82rem var(--font); padding: 7px 12px; cursor: pointer; }
.seg button.on { background: var(--brand); color: var(--brand-ink); }
.filters { display: flex; gap: 12px 20px; flex-wrap: wrap; align-items: flex-end; }
.filters .fld select { min-width: 180px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { flex: none; border: 0; background: none; font: 600 .88rem var(--font); color: var(--ink-2); padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--brand); }
.count { font-size: .72rem; background: var(--surface-2); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }

.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
.r { text-align: right; white-space: nowrap; } th.r { text-align: right; }
td.acts { text-align: right; white-space: nowrap; } td.acts .btn { margin-left: 4px; }
tr.l1 td { background: var(--l1); color: #fff; font-weight: 600; } tr.l1 .ck { color: #fff; }
tr.l2 td { background: var(--l2); font-weight: 600; }
tr.l3 td:first-child { padding-left: 26px; min-width: 220px; } tr.l3.mine td { background: var(--mine); }
tr.ro td { background: var(--surface-2); font: 600 .8rem var(--font); color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
tr.tot td { background: var(--ink); color: var(--bg); font-weight: 700; }
.tw-btn { background: none; border: 0; color: inherit; cursor: pointer; font-size: .9rem; padding: 0 4px; }
.leaf { font-size: .68rem; font-weight: 700; color: var(--ok); background: var(--ok-bg); border-radius: 999px; padding: 1px 7px; }
.co2 { text-align: right; }

.pill { display: inline-block; font-size: .72rem; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.pill.s-ver { background: var(--ok-bg); color: var(--ok); } .pill.s-exp, .pill.s-com { background: var(--warn-bg); color: var(--warn); } .pill.s-fig { background: var(--ink); color: var(--bg); }
.banner { padding: 10px 14px; border-radius: 8px; font-weight: 500; }
.banner.warn { background: var(--warn-bg); color: var(--warn); } .banner.err { background: var(--err-bg); color: var(--err); }
.estbar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: var(--surface-2); border-radius: 10px; }
.estbar label { font-size: .76rem; font-weight: 600; color: var(--ink-2); } .estbar select { width: auto; max-width: 100%; }
.lock { color: var(--warn); font-weight: 500; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; color: var(--ink-2); }
.empty p { max-width: 65ch; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.case-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.case-open { all: unset; cursor: pointer; padding: 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.case-open:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }
.case-num { font: 700 1.05rem var(--display); } .case-amt { margin-top: 8px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.case-card .row-actions { padding: 10px 16px; border-top: 1px solid var(--line); }

.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.room { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.dims { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px 16px; margin: 0; }
.kv div { display: flex; flex-direction: column; } .kv dt { font-size: .74rem; color: var(--ink-2); } .kv dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.kv.big { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; } .kv.big dd { font: 700 1.25rem var(--display); }
.kv.preview { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
.openings { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { background: var(--surface-2); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: .8rem; display: inline-flex; gap: 4px; align-items: center; }
.chip button { border: 0; background: none; color: var(--ink-2); cursor: pointer; font-size: 1rem; line-height: 1; padding: 2px 6px; }
.eco { background: var(--ok-bg); color: var(--ok); border-radius: 8px; padding: 8px 12px; margin-top: 12px; }

.indemn { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
.indemn-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.bens { display: flex; flex-direction: column; gap: 8px; }
.ben { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font: inherit; }
.ben.on { border-color: var(--brand); box-shadow: inset 3px 0 0 var(--brand); } .ben-amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.totals table td:first-child { min-width: 200px; }
@media (max-width: 860px) { .indemn { grid-template-columns: minmax(0, 1fr); } .bens { flex-direction: row; flex-wrap: wrap; } .bens h2 { width: 100%; } .ben { flex: 1 1 200px; } }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--ink); width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(20, 10, 45, .55); }
.dlg-body { padding: 20px 20px 8px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: calc(100vh - 130px); }
.dlg-body ul { margin: 0; padding-left: 20px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 16px; }
.form-err { color: var(--err); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); } .toast.err { background: var(--err); color: var(--surface); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media print { .top, .pager, .actions, .tabs, .estbar, .toast { display: none !important; } body { background: #fff; } .panel { box-shadow: none; } }

/* Import de devis / facture */
.banner.ok { background: var(--ok-bg); color: var(--ok); } .banner.info { background: var(--surface-2); color: var(--ink-2); }
.warn-t { color: var(--warn); display: block; }
.imp-tw { border: 1px solid var(--line); border-radius: 8px; max-height: 44vh; overflow: auto; }
.imp-tw th { position: sticky; top: 0; z-index: 1; }
.imp-tw td { padding: 6px 8px; } .imp-tw .ir-name { min-width: 320px; } .imp-tw .ir-nat { min-width: 190px; } .imp-tw .ir-um { min-width: 68px; } .imp-tw .ir-pu { min-width: 96px; }
.imp-tw tr.off td { opacity: .45; }
dialog:has(.imp-tw) { width: min(1120px, calc(100vw - 24px)); }
</style>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <button class="logo" data-act="home" aria-label="Eureka Chiffrage, retour aux dossiers"><i></i>Eureka Chiffrage</button>
      <div class="crumb" id="crumb"></div>
    </div>
    <nav class="steps" id="steps" aria-label="Étapes du dossier" hidden></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Eureka Chiffrage — moteur de calcul.
   Règles reprises des formules Power Fx de l'app canvas (v2.7.4.0).
   Fonctions pures, sans accès au DOM : testables sous Node. */
(function (root) {
  "use strict";

  const MBV = "Dommages mobiliers et biens volés";
  const RSE = "Bonification RSE";
  const OPENING_TYPES = ["Porte", "Porte fenêtre", "Baie coulissante"];

  // Statuts d'une estimation (EstimateInformationStatuses)
  const STATUS = {
    1: { label: "Brouillon", cat: "Brouillon" },
    2: { label: "Chiffrages vérifiés", cat: "Vérifiée" },
    3: { label: "Garanties vérifiées", cat: "Vérifiée" },
    4: { label: "Chiffrages et garanties vérifiés", cat: "Vérifiée" },
    5: { label: "Indemnisations vérifiées", cat: "Vérifiée" },
    6: { label: "Chiffrages exportés vers Excel", cat: "Exportée" },
    7: { label: "Garanties exportées vers Excel", cat: "Exportée" },
    8: { label: "Chiffrages et garanties exportés vers Excel", cat: "Exportée" },
    9: { label: "Indemnisations exportées vers Excel", cat: "Exportée" },
    10: { label: "Chiffrages communiqués à l'assureur", cat: "Communiquée" },
    11: { label: "Garanties communiquées à l'assureur", cat: "Communiquée" },
    12: { label: "Chiffrages et garanties communiqués à l'assureur", cat: "Communiquée" },
    13: { label: "Indemnisations communiquées à l'assureur", cat: "Communiquée" },
    14: { label: "Chiffrages figés", cat: "Figée" },
    15: { label: "Garanties figées", cat: "Figée" },
    16: { label: "Chiffrages et garanties figés", cat: "Figée" },
    17: { label: "Indemnisations figées", cat: "Figée" },
  };
  const isReadOnly = (s) => s >= 6; // ReadOnlyEstimateInformationStatuses
  const STANCES = {
    1: { label: "Sans réserve", compensable: true },
    2: { label: "Avec réserve", compensable: true },
    3: { label: "Garantie non applicable", compensable: false },
  };

  const num = (x) => (typeof x === "number" && isFinite(x) ? x : 0);
  const blank = (x) => x === null || x === undefined || x === "";
  const round = (x, d) => {
    const f = Math.pow(10, d);
    const v = num(x) * f;
    return (Math.sign(v) * Math.round(Math.abs(v) + 1e-9)) / f;
  };
  const r2 = (x) => round(x, 2);
  const r1 = (x) => round(x, 1);
  const roundDown2 = (x) => Math.floor(num(x) * 100 + 1e-7) / 100;
  const sum = (arr, f) => arr.reduce((a, x) => a + num(f(x)), 0);

  /* ---------- Lignes de dommages (prestations) ---------- */

  // Colonnes calculées Dataverse PriceNoVAT / PriceWithVAT
  function linePrices(d) {
    const ht = d.l1 === RSE ? num(d.unit) / 100 : num(d.unit) * num(d.qty);
    return { priceNoVAT: r2(ht), priceWithVAT: r2(ht * (1 + num(d.vat) / 100)) };
  }

  /* Montants d'une ligne selon le régime fiscal du calcul (ttc = true → TTC).
     obsAmountInput non vide = montant de vétusté saisi (il remplace le %). */
  function damageAmounts(d, ttc) {
    const p = linePrices(d);
    if (d.l1 === RSE) {
      // 1 % RSE : pas de vétusté, le montant retenu est le montant de la bonification
      const amount = ttc ? p.priceWithVAT : p.priceNoVAT;
      return { ...p, base: amount, obsPct: 0, obsAmount: amount, priceWithObs: amount };
    }
    const base = r2(num(d.unit) * num(d.qty) * (ttc ? 1 + num(d.vat) / 100 : 1));
    const entered = !blank(d.obsAmountInput);
    const obsPct = entered ? 0 : num(d.obsPct);
    const obsAmount = entered ? num(d.obsAmountInput) : r2((base * obsPct) / 100);
    return { ...p, base, obsPct, obsAmount, priceWithObs: r2(base - obsAmount) };
  }

  // Changement de régime fiscal HT/TTC : recalcul de la vétusté de chaque ligne
  function recalcOnTaxRegime(d, ttc) {
    if (d.l1 === RSE) {
      const a = damageAmounts(d, ttc);
      return { obsAmount: a.obsAmount, priceWithObs: a.priceWithObs };
    }
    const price = r2(ttc ? d.priceWithVAT : d.priceNoVAT);
    const amountEntered = num(d.obsPct) === 0 && num(d.obsAmount) > 0;
    const obsAmount = amountEntered ? d.obsAmount : r2((price * num(d.obsPct)) / 100);
    return { obsAmount, priceWithObs: r2(price - obsAmount) };
  }

  // Vétusté transverse appliquée à toute une nature (niveau 1)
  function transverseObsolescence(d, pct, ttc) {
    const base = num(d.qty) * num(d.unit) * (ttc ? 1 + num(d.vat) / 100 : 1);
    return {
      obsPct: r1(pct),
      obsAmount: r2((base * pct) / 100),
      priceWithObs: r2(base * (1 - pct / 100)),
    };
  }

  // Montant retenu pour l'assiette IRSI
  function irsiAmount(benefit, d) {
    if (!benefit || benefit.damageREC !== "Materiel") return null;
    const content = benefit.synth1 === "Contenu" || benefit.synth1 === "Contenu professionnel";
    if (d.l1 === RSE) return content ? num(d.priceWithObs) : num(d.unit);
    return content ? num(d.unit) * num(d.qty) * (1 - num(d.obsPct) / 100) : num(d.unit) * num(d.qty);
  }

  const pad2 = (n) => String(n).padStart(2, "0");
  // Index de ligne AxxBxxCxx (nature / détail / prestation)
  function nextLineIndex(damages, l1, l2) {
    const sorted = damages.slice().sort((a, b) => (a.lineIndex < b.lineIndex ? -1 : 1));
    if (l1 === MBV) {
      const same = sorted.filter((d) => d.l2 === l2);
      if (same.length) {
        const last = same[same.length - 1].lineIndex;
        return last.slice(0, 7) + pad2(+last.slice(-2) + 1);
      }
      const last = sorted.length ? +sorted[sorted.length - 1].lineIndex.slice(4, 6) : 0;
      return "A99B" + pad2(last + 1) + "C01";
    }
    const a = sorted.find((d) => d.l1 === l1);
    if (!a) {
      if (!sorted.length) return "A01B01C01";
      return "A" + pad2(+sorted[sorted.length - 1].lineIndex.slice(1, 3) + 1) + "B01C01";
    }
    const aIdx = a.lineIndex.slice(0, 3);
    const b = sorted.filter((d) => d.l1 === l1 && d.l2 === l2);
    if (!b.length) {
      const inA = sorted.filter((d) => d.lineIndex.slice(0, 3) === aIdx);
      return aIdx + "B" + pad2(+inA[inA.length - 1].lineIndex.slice(4, 6) + 1) + "C01";
    }
    const last = b[b.length - 1].lineIndex;
    return last.slice(0, 7) + pad2(+last.slice(-2) + 1);
  }

  /* ---------- Mobilier et biens volés ---------- */
  function mbvAmounts(m, ttc) {
    const ht = num(m.ht);
    const hasVat = !blank(m.vat);
    const ttcAmount = r2(ht * (1 + num(m.vat) / 100));
    const base = ttc ? ttcAmount : ht;
    const entered = !blank(m.obsAmountInput);
    const obsPct = entered ? 0 : num(m.obsPct);
    const obsAmount = entered ? num(m.obsAmountInput) : r2((base * obsPct) / 100);
    return {
      priceNoVAT: r2(ht), priceWithVAT: hasVat ? ttcAmount : r2(ht), base, obsPct, obsAmount,
      priceWithObs: r2(base - obsAmount),
    };
  }
  const htFromTtc = (ttcAmount, vat) => num(ttcAmount) / (1 + num(vat) / 100);
  function mbvIrsiAmount(benefit, m) {
    if (!benefit || benefit.damageREC !== "Materiel") return null;
    const content = benefit.synth1 === "Contenu" || benefit.synth1 === "Contenu professionnel";
    return content ? num(m.ht) * (1 - num(m.obsPct) / 100) : num(m.ht);
  }

  /* ---------- Indemnisation ---------- */

  /* Regroupe les dommages de l'assuré en lignes indemnisables.
     comps : { [groupKey]: {beneficiaryId, ceiling, level1Ceiling, cPct, cAmt, immediate, deferred} } */
  function buildGroups(damages, calcById, comps) {
    const map = new Map();
    const sorted = damages.filter((d) => !blank(d.name)).sort((a, b) => (a.lineIndex < b.lineIndex ? -1 : 1));
    for (const d of sorted) {
      const isMbv = d.l1 === MBV;
      const key = isMbv
        ? [d.riskObjectId, d.l2, d.name].join("_").trim()
        : [d.riskObjectId, d.l1, d.l2, d.mode, d.beneficiaryName || ""].join("_").trim();
      let g = map.get(key);
      if (!g) {
        const calc = calcById[d.calculationId] || {};
        g = {
          key, riskObjectId: d.riskObjectId, isMbv,
          l1: isMbv ? d.l2 : d.l1, l2: isMbv ? d.name : d.l2,
          mode: d.mode, beneficiaryName: isMbv ? "" : d.beneficiaryName || "",
          isTaxed: !!calc.taxRegime,
          priceNoVATTotal: 0, priceWithTaxTotal: 0, obsTotal: 0, priceWithObsTotal: 0,
        };
        map.set(key, g);
      }
      g.priceNoVATTotal += num(d.priceNoVAT);
      g.priceWithTaxTotal += num(d.priceWithVAT);
      g.obsTotal += num(d.obsAmount);
      g.priceWithObsTotal += num(d.priceWithObs);
    }
    const out = [];
    for (const g of map.values()) {
      ["priceNoVATTotal", "priceWithTaxTotal", "obsTotal", "priceWithObsTotal"].forEach((k) => (g[k] = r2(g[k])));
      const c = (comps && comps[g.key]) || {};
      g.beneficiaryId = c.beneficiaryId || null;
      g.ceiling = blank(c.ceiling) ? null : c.ceiling;
      g.level1Ceiling = blank(c.level1Ceiling) ? null : c.level1Ceiling;
      g.cPct = blank(c.cPct) ? null : c.cPct;
      g.cAmt = blank(c.cAmt) ? null : c.cAmt;
      g.immediate = num(c.immediate);
      g.deferred = num(c.deferred);
      out.push(g);
    }
    return out;
  }

  const gBase = (g) => (g.isTaxed ? g.priceWithTaxTotal : g.priceNoVATTotal);
  // Assiette de la vétusté contractuelle : 1 = valeur à neuf, 2 = valeur vétusté déduite
  const cBase = (g, option) => (option === 1 ? gBase(g) : g.priceWithObsTotal);
  const isREN = (g) => String(g.mode) === "REN";

  function capToCeiling(g, ceiling) {
    if (!blank(ceiling) && g.immediate + g.deferred > ceiling) {
      if (g.immediate > ceiling) { g.immediate = ceiling; g.deferred = 0; }
      else g.deferred = r2(ceiling - g.immediate);
    }
  }
  const noCeiling = (c) => blank(c) || c === 0;

  // Ventilation d'une ligne vers un bénéficiaire (case cochée)
  function assignGroup(g, beneficiaryId, genericPct, option) {
    const cAmt = r2((cBase(g, option) * num(genericPct)) / 100);
    const recoverable = Math.min(gBase(g) - g.priceWithObsTotal, cAmt);
    g.beneficiaryId = beneficiaryId;
    g.cPct = blank(genericPct) ? null : genericPct;
    g.cAmt = cAmt;
    g.deferred = isREN(g) ? 0 : recoverable;
    const imm = isREN(g) ? g.priceWithObsTotal + recoverable : g.priceWithObsTotal;
    g.immediate = noCeiling(g.ceiling) ? imm : Math.min(g.ceiling, imm);
    g.immediate = r2(g.immediate); g.deferred = r2(g.deferred);
    capToCeiling(g, g.ceiling);
    return g;
  }
  function unassignGroup(g) {
    g.beneficiaryId = null; g.immediate = 0; g.deferred = 0;
    return g;
  }

  // Saisie du % de vétusté contractuelle (récupérable) sur une ligne
  function setContractPct(g, pct, option) {
    const p = r1(pct);
    const cAmt = r2((cBase(g, option) * p) / 100);
    const recoverable = Math.min(gBase(g) - g.priceWithObsTotal, cAmt);
    g.cPct = p; g.cAmt = cAmt;
    g.deferred = r2(isREN(g) ? 0 : recoverable);
    g.immediate = r2(isREN(g) ? g.priceWithObsTotal + recoverable : g.priceWithObsTotal);
    capToCeiling(g, g.ceiling);
    return g;
  }

  // Saisie du montant de vétusté contractuelle
  function setContractAmount(g, amount, option) {
    const base = cBase(g, option);
    g.cAmt = amount;
    if (g.priceWithTaxTotal > 0 && base > 0) g.cPct = r1((100 * amount) / base);
    g.deferred = r2(isREN(g) ? 0 : Math.min(g.obsTotal, amount));
    if (isREN(g)) g.immediate = r2(g.priceWithObsTotal + Math.min(g.obsTotal, amount));
    capToCeiling(g, g.ceiling);
    return g;
  }

  // Saisie du plafond d'une ligne (null = pas de plafond)
  function setCeiling(g, ceiling, genericPct, option) {
    const cAmt = r2((cBase(g, option) * num(genericPct)) / 100);
    const recoverable = Math.min(g.obsTotal, cAmt);
    g.ceiling = blank(ceiling) ? null : ceiling;
    g.deferred = r2(isREN(g) ? 0 : recoverable);
    const imm = isREN(g) ? g.priceWithObsTotal + recoverable : g.priceWithObsTotal;
    g.immediate = r2(noCeiling(g.ceiling) ? imm : Math.min(g.ceiling, imm));
    capToCeiling(g, g.ceiling);
    return g;
  }

  // Plafond d'une nature : réparti au prorata entre les lignes du bénéficiaire (arrondi inférieur)
  function setLevel1Ceiling(groups, l1, beneficiaryId, value, option) {
    const lines = groups.filter((g) => g.l1 === l1 && g.beneficiaryId === beneficiaryId);
    const lineMax = (g) => Math.min(
      gBase(g), blank(g.ceiling) ? gBase(g) : g.ceiling,
      g.priceWithObsTotal + r2((cBase(g, option) * num(g.cPct)) / 100));
    const total = sum(lines, lineMax);
    for (const g of lines) {
      g.level1Ceiling = blank(value) ? null : value;
      if (!(total > 0)) continue;
      const cAmt = r2((cBase(g, option) * num(g.cPct)) / 100);
      const recoverable = Math.min(g.obsTotal, cAmt);
      const imm = isREN(g) ? g.priceWithObsTotal + recoverable : g.priceWithObsTotal;
      g.deferred = r2(isREN(g) ? 0 : recoverable);
      if (blank(value)) {
        // plafond de nature retiré : retour aux montants de la ligne
        g.immediate = r2(noCeiling(g.ceiling) ? imm : Math.min(g.ceiling, imm));
        capToCeiling(g, g.ceiling);
        continue;
      }
      const share = roundDown2(value * (lineMax(g) / total));
      g.immediate = r2(noCeiling(g.ceiling) ? Math.min(imm, share) : Math.min(g.ceiling, imm, share));
      capToCeiling(g, share);
    }
    return groups;
  }

  // Application d'un % de vétusté contractuelle à toutes les lignes du bénéficiaire
  function applyGenericPct(groups, beneficiaryId, genericPct, option) {
    for (const g of groups.filter((x) => x.beneficiaryId === beneficiaryId)) {
      const pct = blank(genericPct) ? g.cPct : genericPct;
      const cAmt = r2((cBase(g, option) * num(pct)) / 100);
      const recoverable = Math.min(gBase(g) - g.priceWithObsTotal, cAmt);
      g.cPct = pct; g.cAmt = cAmt;
      g.deferred = r2(isREN(g) ? 0 : recoverable);
      const imm = isREN(g) ? g.priceWithObsTotal + recoverable : g.immediate;
      g.immediate = r2(noCeiling(g.ceiling) ? imm : Math.min(g.ceiling, imm));
      capToCeiling(g, g.ceiling);
    }
    return groups;
  }

  const ceilingOverrun = (g) => (blank(g.ceiling) ? 0 : Math.max(0, r2(gBase(g) - g.ceiling)));
  const obsOverdraft = (g) => Math.max(0, r2(g.obsTotal - num(g.cAmt)));

  // Totaux d'un bénéficiaire : remise, pénalités, franchise
  function beneficiaryTotals(groups, ben) {
    const mine = groups.filter((g) => g.beneficiaryId === ben.id);
    const k = 1 - num(ben.discount) / 100;
    const subImmediate = sum(mine, (g) => g.immediate);
    const subDeferred = sum(mine, (g) => g.deferred);
    return {
      damages: r2(sum(mine, gBase)), obs: r2(sum(mine, (g) => g.obsTotal)),
      contractObs: r2(sum(mine, (g) => g.cAmt)), overdraft: r2(sum(mine, obsOverdraft)),
      ceilingOverrun: r2(sum(mine, ceilingOverrun)),
      subImmediate: r2(subImmediate), subDeferred: r2(subDeferred),
      discountedImmediate: r2(subImmediate * k), discountedDeferred: r2(subDeferred * k),
      totalImmediate: r2(Math.max(subImmediate * k - num(ben.penalization) - num(ben.deductible), 0)),
      totalDeferred: r2(Math.max(subDeferred * k - num(ben.deferredPenalization) - num(ben.deferredDeductible), 0)),
    };
  }

  // Contrôles de l'écran Indemnisations (premier message bloquant)
  function compensationError(groups, beneficiaries) {
    if (beneficiaries.some((b) => blank(b.deductible) || blank(b.deferredDeductible)))
      return "Les montants de franchise sont obligatoires, veuillez saisir 0 si non applicable";
    const assigned = groups.filter((g) => g.beneficiaryId);
    const overCeiling = assigned.some((g) =>
      (!blank(g.level1Ceiling) && r2(sum(assigned.filter((x) => x.l1 === g.l1 && x.beneficiaryId === g.beneficiaryId),
        (x) => x.immediate + x.deferred)) > r2(g.level1Ceiling)) ||
      (!blank(g.ceiling) && r2(g.immediate + g.deferred) > r2(g.ceiling)));
    if (overCeiling) return "Le montant de certaines indemnités dépasse le plafond associé";
    if (beneficiaries.length && assigned.some((g) => g.l1 !== RSE &&
      r2(g.immediate + g.deferred) > r2(gBase(g) - g.obsTotal + num(g.cAmt))))
      return "Les indemnités ne doivent pas dépasser les dommages. Veuillez ajuster les montants.";
    return "";
  }

  /* ---------- Vérification d'une estimation ---------- */
  /* hasCoverages : le dossier porte des contrats/garanties (équivalent d'un dossier initié par ProsPecT). */
  function verifyEstimate(ctx) {
    const { damages, stances, beneficiaries, groups, damageEstimate, position, hasCoverages,
      insuredId, coverages, riskObjectIds } = ctx;
    const hasDamages = damages.length > 0 || num(damageEstimate) > 0;
    const assigned = groups.filter((g) => g.beneficiaryId);
    const errors = [];
    let status = null;
    if (!beneficiaries.length || !assigned.length) {
      if ((hasDamages && !stances.length) || (hasDamages && !hasCoverages)) status = 2;
      else if (!hasDamages && stances.length && hasCoverages) status = 3;
      else if (hasDamages && stances.length && hasCoverages) status = 4;
    } else {
      // objets de risque couverts par une garantie applicable
      const applicable = new Set();
      for (const s of stances.filter((x) => x.stance === 1 || x.stance === 2)) {
        const cov = coverages.find((c) => c.id === s.coverageId);
        const covered = cov && cov.coveredRiskObjects && cov.coveredRiskObjects.length ? cov.coveredRiskObjects : riskObjectIds;
        covered.forEach((id) => applicable.add(id));
      }
      const toCover = groups.filter((g) => applicable.has(g.riskObjectId));
      const allCompensated = toCover.every((g) => g.beneficiaryId);
      if (!allCompensated)
        errors.push("Tous les dommages couverts par une garantie applicable doivent être ventilés dans l'indemnisation");
      if (blank(position)) errors.push("Une position de l'assuré sur l'indemnisation doit être sélectionnée");
      if (allCompensated && !blank(position)) status = 5;
    }
    return { status, errors, insuredId };
  }

  // Assiette IRSI : somme des montants IRSI des calculs actifs inclus dans l'assiette
  function irsiBase(damages, calcById) {
    return r2(sum(damages.filter((d) => {
      const c = calcById[d.calculationId];
      return c && c.includedInIRSI && c.active;
    }), (d) => d.irsiAmount));
  }
  // Un calcul est actif s'il porte un montant de dommages ou un montant réclamé
  const calculationActive = (calc, damages) =>
    sum(damages.filter((d) => d.calculationId === calc.id && num(d.priceWithVAT) > 0), (d) => d.priceWithVAT) > 0 ||
    num(calc.claimedAmount) > 0;

  /* ---------- Localisations ---------- */
  function roomMeasures(room) {
    let length = num(room.length), width = num(room.width);
    const height = num(room.height);
    let floor = r2(length * width);
    if (!(length > 0) && num(room.surface) > 0) {
      // surface seule connue : dimensions estimées au nombre d'or
      floor = num(room.surface);
      length = r2(Math.sqrt(floor * 1.618));
      width = width > 0 ? width : r2(floor / length);
    } else if (!(width > 0) && num(room.surface) > 0 && length > 0) {
      floor = num(room.surface); width = r2(floor / length);
    }
    const perimeter = r2((length + width) * 2);
    const openings = room.openings || [];
    const openingsArea = r2(sum(openings, (o) => num(o.width) * num(o.height)));
    const doorsWidth = r2(sum(openings.filter((o) => OPENING_TYPES.includes(o.type)), (o) => o.width));
    return {
      length, width, height, floor, ceiling: floor, perimeter,
      wallsGross: r2(perimeter * height),
      walls: Math.max(0, r2(perimeter * height - openingsArea)),
      skirting: Math.max(0, r2(perimeter - doorsWidth)),
      volume: r2(floor * height),
    };
  }

  const api = {
    MBV, RSE, STATUS, STANCES, OPENING_TYPES, isReadOnly, num, blank, r1, r2, roundDown2, sum,
    linePrices, damageAmounts, recalcOnTaxRegime, transverseObsolescence, irsiAmount, nextLineIndex,
    mbvAmounts, htFromTtc, mbvIrsiAmount,
    buildGroups, gBase, assignGroup, unassignGroup, setContractPct, setContractAmount, setCeiling,
    setLevel1Ceiling, applyGenericPct, ceilingOverrun, obsOverdraft, beneficiaryTotals, compensationError,
    verifyEstimate, irsiBase, calculationActive, roomMeasures,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.EC = api;
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* Lecture d'un devis ou d'une facture : repère les lignes chiffrées dans le texte du document.
   Fonctions pures (testables sous Node). Les colonnes sont séparées par des tabulations quand
   le texte vient d'un PDF ; un texte collé, séparé par de simples espaces, est aussi accepté. */
(function (root) {
  "use strict";

  const VAT_RATES = [0, 2.1, 5.5, 8.5, 10, 20];
  const UNITS = [
    [/^(m²|m2|m\^2|mq)$/i, "m²"], [/^(m3|m³)$/i, "m3"], [/^(ml|m|mètres?|metres?|ml\.)$/i, "ml"],
    [/^(h|hr|hrs|heures?)$/i, "H"], [/^(f|ff|fft|forf|forfait|forfaits|ft)$/i, "FFT"],
    [/^(u|un|unité|unités|unite|pce|pces|pièce|pièces|piece|ens|ensemble|lot|j|jour|jours)\.?$/i, "U"],
  ];
  const SKIP = /^(sous[- ]?total|total|totaux|t\.?v\.?a\b|net\s+[àa]\s+payer|acompte|montant|base\s+h\.?t|remise|escompte|page\b|siret|siren|iban|bic|t[ée]l\b|t[ée]l[ée]phone|fax|capital|r\.?c\.?s|ape\b|naf\b|n°\s*tva|date\b|devis\b|facture\b|validit[ée]|conditions|r[èe]glement|[ée]ch[ée]ance|bon\s+pour|signature|report\b|d[ée]signation|description|libell[ée]|r[ée]f[ée]rence\b|quantit[ée]|qt[ée]\b|code\s+client|client\b|adresse)/i;

  const near = (a, b) => Math.abs(a - b) <= Math.max(0.02, Math.abs(b) * 0.005);
  const r2 = (x) => Math.round(x * 100 + 1e-9) / 100;

  // "1 234,56" · "1.234,56" · "1234.56" · "12,5"
  function toNumber(s) {
    let t = String(s).replace(/[\s  €]/g, "");
    if (t.includes(",") && t.includes(".")) t = t.lastIndexOf(",") > t.lastIndexOf(".") ? t.replace(/\./g, "").replace(",", ".") : t.replace(/,/g, "");
    else if (t.includes(",")) t = t.replace(",", ".");
    else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
    const v = parseFloat(t);
    return isFinite(v) ? v : null;
  }
  const NUM_GROUPED = /-?\d{1,3}(?:[   ]\d{3})+(?:[.,]\d+)?|-?\d+(?:[.,]\d+)?/g; // séparateur de milliers accepté
  const NUM_PLAIN = /-?\d+(?:[.,]\d+)?/g;
  const isNumTok = (t) => /^-?\d+(?:[.,]\d+)*$/.test(t);
  const unitOf = (t) => { const u = UNITS.find(([re]) => re.test(t)); return u ? u[1] : null; };
  const isFiller = (t) => /^(€|eur|euros?|%|x|×|\*|=|:|ht|h\.t\.?|ttc|t\.t\.c\.?|-)$/i.test(t);

  // Cherche quantité × prix unitaire = total parmi les nombres de fin de ligne
  function findTriple(nums) {
    for (let k = nums.length - 1; k >= 2; k--)
      for (let j = k - 1; j >= 1; j--)
        for (let i = j - 1; i >= 0; i--)
          if (nums[i] > 0 && nums[j] >= 0 && near(nums[i] * nums[j], nums[k])) return { i, j, k };
    return null;
  }

  function parseLine(raw) {
    let s = raw.replace(/ | /g, " ").replace(/^[\s\-•*·]+/, "").trim();
    if (!s) return null;
    // "20m²" → "20 m²", "12,50€" → "12,50 €"
    s = s.replace(/(\d)(m²|m2|m3|m³|ml|€|%)(?=\s|$)/gi, "$1 $2");
    const cells = s.split(/\t+| {2,}/).map((c) => c.trim()).filter(Boolean);
    const toks = cells.join(" \t ").split(/ +/).filter(Boolean);
    // fin de ligne faite uniquement de nombres, unités et symboles
    let cut = toks.length;
    while (cut > 0) {
      const t = toks[cut - 1];
      if (t === "\t" || isNumTok(t) || isFiller(t) || (unitOf(t) && cut - 1 > 0) || /^\d+(?:[.,]\d+)?%$/.test(t)) cut--;
      else break;
    }
    // la désignation garde ses propres nombres ("Peinture 2 couches")
    while (cut < toks.length && (toks[cut] === "\t" || isFiller(toks[cut]))) cut++;
    const name = toks.slice(0, cut).filter((t) => t !== "\t").join(" ").replace(/[\s:;,.\-]+$/, "").trim();
    const tailToks = toks.slice(cut);
    if (!tailToks.some(isNumTok) && !tailToks.some((t) => /\d%$/.test(t))) return { text: s };

    let unit = null, vat = null;
    const hasCurrency = tailToks.some((t) => /^(€|eur|euros?)$/i.test(t));
    const kept = [];
    tailToks.forEach((t, idx) => {
      const pm = t.match(/^(\d+(?:[.,]\d+)?)%$/);
      if (pm) { vat = toNumber(pm[1]); return; }
      if (t === "%" && kept.length && isNumTok(kept[kept.length - 1])) { vat = toNumber(kept.pop()); return; }
      const u = !isNumTok(t) && unitOf(t);
      if (u) { if (!unit) unit = u; kept.push("\t"); return; }
      if (isFiller(t)) { kept.push("\t"); return; }
      kept.push(t);
    });
    const tail = kept.join(" ");
    const hasDecimals = /\d[.,]\d{2}(?!\d)/.test(tail);
    const read = (re) => tail.split("\t").flatMap((cell) => (cell.match(re) || []).map(toNumber)).filter((x) => x !== null);
    let nums, tri;
    if (cells.length > 1) {
      // vraies colonnes : "2 450,00" dans une cellule est un seul montant
      nums = read(NUM_GROUPED); tri = findTriple(nums);
    } else {
      // espaces simples : "2 150,00 300,00" se lit 2 × 150 = 300, "1 234,56 1 234,56" un montant répété
      const g = read(NUM_GROUPED), tg = findTriple(g), pl = read(NUM_PLAIN), tp = findTriple(pl);
      const useGrouped = (g.length === 2 && near(g[0], g[1])) || (tg && tp ? g[tg.k] > pl[tp.k] : !tp);
      if (useGrouped) { nums = g; tri = tg; } else { nums = pl; tri = tp; }
    }

    let qty, unitPrice, total, check = false;
    if (tri) {
      qty = nums[tri.i]; unitPrice = nums[tri.j]; total = nums[tri.k];
      if (vat === null) { const rest = nums.filter((_, x) => x !== tri.i && x !== tri.j && x !== tri.k).find((x) => VAT_RATES.includes(x) && x > 0); if (rest !== undefined) vat = rest; }
    } else if (nums.length === 1) {
      if (!hasDecimals && !hasCurrency && !unit) return { text: s };
      qty = 1; unitPrice = nums[0]; total = nums[0];
    } else if (nums.length === 2) {
      if (!hasDecimals && !hasCurrency) return { text: s };
      if (near(nums[0], nums[1])) { qty = 1; unitPrice = nums[1]; total = nums[1]; }
      else { qty = nums[0]; unitPrice = nums[1]; total = r2(qty * unitPrice); check = true; }
    } else {
      // pas de produit cohérent : on retient le dernier montant comme total
      if (!hasDecimals && !hasCurrency) return { text: s };
      total = nums[nums.length - 1]; qty = 1; unitPrice = total; check = true;
    }
    if (!(unitPrice > 0) && !(total > 0)) return { text: s };
    return { name, qty, unit, unitPrice, vat, total: r2(total), check };
  }

  function lastAmount(line) {
    const m = line.replace(/ | /g, " ").match(NUM_GROUPED);
    if (!m) return null;
    const dec = m.filter((x) => /[.,]\d{2}$/.test(x));
    return toNumber((dec.length ? dec : m).pop());
  }

  function parseQuoteText(text) {
    const lines = String(text || "").replace(/;/g, "\t").split(/\r?\n/).map((l) => l.replace(/\s+$/, ""));
    const out = { kind: null, supplier: null, number: null, date: null, totals: { ht: null, vat: null, ttc: null }, lines: [] };
    let pending = null;
    for (const raw of lines) {
      const s = raw.trim();
      if (!s) { pending = null; continue; }
      if (!out.supplier && /[A-Za-zÀ-ÿ]{3}/.test(s) && !SKIP.test(s)) out.supplier = s.split(/\t| {2,}/)[0].trim().slice(0, 60);
      if (!out.kind) { const k = s.match(/\b(facture|devis)\b/i); if (k) out.kind = k[1].toLowerCase(); }
      if (!out.number) { const n = s.match(/\b(?:facture|devis)\s*(?:n[°ºo]\.?|num[ée]ro|#)?\s*[:#]?\s*([A-Z0-9][\w\-\/]*\d[\w\-\/]*)/i); if (n) out.number = n[1]; }
      if (!out.date) { const d = s.match(/\b(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})\b/); if (d) out.date = d[1]; }
      if (/total\s*(g[ée]n[ée]ral\s*)?t\.?\s*t\.?\s*c|net\s+[àa]\s+payer|montant\s*t\.?t\.?c/i.test(s)) { out.totals.ttc = lastAmount(s); pending = null; continue; }
      if (/(total|montant|base)\s*(g[ée]n[ée]ral\s*)?h\.?\s*t/i.test(s) && !/sous/i.test(s)) { out.totals.ht = lastAmount(s); pending = null; continue; }
      if (/^(total\s*)?(montant\s*)?t\.?v\.?a/i.test(s)) { out.totals.vat = lastAmount(s); pending = null; continue; }
      if (SKIP.test(s)) { pending = null; continue; }
      const p = parseLine(raw);
      if (!p) continue;
      if (p.text !== undefined) { if (/[A-Za-zÀ-ÿ]{3}/.test(p.text)) pending = p.text.replace(/\t/g, " "); continue; } // seule la dernière ligne de texte sert de désignation
      if (p.name.replace(/[^A-Za-zÀ-ÿ]/g, "").length < 3) {
        if (!pending) continue; // montant isolé sans désignation
        p.name = (pending + " " + p.name).trim();
      }
      pending = null;
      out.lines.push(p);
    }
    out.linesTotal = r2(out.lines.reduce((a, l) => a + l.total, 0));
    return out;
  }

  /* Texte d'une page PDF à partir des fragments positionnés (pdf.js) :
     même ordonnée = même ligne, grand écart horizontal = changement de colonne. */
  function itemsToText(items) {
    const rows = [];
    for (const it of items) {
      if (!it.str || !it.str.trim()) continue;
      const row = rows.find((r) => Math.abs(r.y - it.y) <= Math.max(2, (it.h || 8) * 0.35));
      if (row) row.items.push(it); else rows.push({ y: it.y, items: [it] });
    }
    rows.sort((a, b) => b.y - a.y);
    return rows.map((r) => {
      r.items.sort((a, b) => a.x - b.x);
      let line = "", end = null;
      for (const it of r.items) {
        if (end !== null) { const gap = it.x - end; line += gap > Math.max(7, (it.h || 8) * 0.9) ? "\t" : gap > 0.8 ? " " : ""; }
        line += it.str.trim(); end = it.x + (it.w || 0);
      }
      return line;
    }).join("\n");
  }

  // Réponse JSON de l'analyse par Claude → même structure que parseQuoteText
  function fromModel(j) {
    const n = (x) => (typeof x === "number" && isFinite(x) ? x : typeof x === "string" ? toNumber(x) : null);
    const out = { kind: j && /fact/i.test(j.kind || "") ? "facture" : j && j.kind ? "devis" : null, supplier: (j && j.supplier) || null, number: (j && j.number) || null, date: (j && j.date) || null,
      totals: { ht: n(j && j.totalHT), vat: null, ttc: n(j && j.totalTTC) }, lines: [] };
    for (const l of (j && Array.isArray(j.lines) ? j.lines : [])) {
      const total = n(l.totalHT), q = n(l.quantity), pu = n(l.unitPriceHT);
      if (!l.designation || (total === null && pu === null)) continue;
      const qty = q > 0 ? q : 1, unitPrice = pu !== null ? pu : r2(total / qty);
      out.lines.push({ name: String(l.designation).trim(), qty, unit: l.unit ? unitOf(String(l.unit).trim()) || null : null, unitPrice, vat: n(l.vatRate), total: total !== null ? r2(total) : r2(qty * unitPrice), check: total !== null && !near(qty * unitPrice, total) });
    }
    out.linesTotal = r2(out.lines.reduce((a, l) => a + l.total, 0));
    return out;
  }

  const api = { parseQuoteText, parseLine, itemsToText, fromModel, toNumber };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.ECExtract = api;
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* Eureka Chiffrage — interface web. État conservé dans le navigateur (localStorage). */
(function () {
  "use strict";
  const { MBV, RSE, STATUS, STANCES, num, blank, r2 } = EC;
  const L = ECData.LISTS;
  const KEY = "eureka-chiffrage-v1";
  const $ = (s, el) => (el || document).querySelector(s);
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const h = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nf2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const eur = (x) => (blank(x) ? "–" : nf2.format(x).replace(/ /g, " ") + " €");
  const n2 = (x) => (blank(x) ? "" : nf2.format(x).replace(/ /g, " "));
  const pct = (x) => (blank(x) ? "" : String(Math.round(x * 10) / 10).replace(".", ","));
  const qty = (x) => (blank(x) ? "" : String(Math.round(x * 1000) / 1000).replace(".", ","));
  // Saisie numérique : virgule ou point, espaces ignorés. undefined = saisie invalide, null = vide
  function parseNum(s) {
    const t = String(s == null ? "" : s).replace(/[\s  €%]/g, "").replace(",", ".");
    if (t === "") return null;
    return /^[-+]?\d*\.?\d+$/.test(t) ? parseFloat(t) : undefined;
  }
  const today = () => new Date().toISOString().slice(0, 10);
  const frDate = (d) => (d ? d.slice(0, 10).split("-").reverse().join("/") : "");

  /* ---------- État ---------- */
  let storageOk = true;
  function load() {
    try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { storageOk = false; return null; }
  }
  let db = load() || { cases: [], refs: clone(ECData.refs) };
  const ui = { view: "home", step: "infos", caseId: null, estId: null, tpId: null, roId: null, benId: null,
    tab: "prest", synthTab: "main", option: 1, genericPct: null, collapsed: {}, onlyMine: false };
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(db)); storageOk = true; } catch (e) { storageOk = false; }
  }
  const cur = () => db.cases.find((c) => c.id === ui.caseId);
  const est = () => { const c = cur(); return c && (c.estimates.find((e) => e.id === ui.estId) || c.estimates[0]); };
  const insured = (c) => c.thirdParties.find((t) => t.insured);
  const readOnly = () => { const e = est(); return !!e && EC.isReadOnly(e.status); };
  const hasCoverages = (c) => c.coverages.length > 0;
  const roLabel = (c, id) => { const r = c.riskObjects.find((x) => x.id === id); return r ? `${r.riskType} - ${r.address1}${r.city ? ", " + (r.postalCode || "") + " " + r.city : ""}` : "Sans objet de risque"; };
  const covLabel = (cv) => `Contrat ${cv.policyNumber || "?"} · ${[cv.coverageType, cv.complementary, cv.precision].filter(Boolean).join(" · ")}`;

  function newEstimate(c) {
    const last = c.estimates.reduce((m, e) => Math.max(m, +(String(e.name).match(/\d+/) || [0])[0]), 0);
    return { id: uid(), name: "Estimation " + (last + 1), status: 1, statusDate: new Date().toISOString(), active: true,
      damageEstimate: null, position: null, irsiBase: null, calculations: [], damages: [], stances: [], beneficiaries: [], comps: {} };
  }
  function getCalc(e, tpId, roId, create) {
    let k = e.calculations.find((x) => x.thirdPartyId === tpId && (x.riskObjectId || null) === (roId || null));
    if (!k && create) {
      k = { id: uid(), thirdPartyId: tpId, riskObjectId: roId || null, taxRegime: true, claimedAmount: null, includedInIRSI: true, active: false };
      e.calculations.push(k);
    }
    return k;
  }
  const calcMap = (e) => Object.fromEntries(e.calculations.map((k) => [k.id, k]));
  // Toute modification repasse l'estimation en brouillon
  function touch(e, calc) {
    e.status = 1; e.statusDate = new Date().toISOString(); e.active = true;
    if (calc) calc.active = EC.calculationActive(calc, e.damages);
    save();
  }
  function groupsOf(c, e) {
    const ins = insured(c);
    const dmg = ins ? e.damages.filter((d) => d.thirdPartyId === ins.id) : [];
    const groups = EC.buildGroups(dmg, calcMap(e), e.comps);
    const benIds = new Set(e.beneficiaries.map((b) => b.id));
    groups.forEach((g) => { if (g.beneficiaryId && !benIds.has(g.beneficiaryId)) EC.unassignGroup(g); });
    return groups;
  }
  function storeGroups(e, groups) {
    e.comps = {};
    for (const g of groups) {
      if (g.beneficiaryId || !blank(g.ceiling) || !blank(g.level1Ceiling))
        e.comps[g.key] = { beneficiaryId: g.beneficiaryId, ceiling: g.ceiling, level1Ceiling: g.level1Ceiling, cPct: g.cPct, cAmt: g.cAmt, immediate: g.immediate, deferred: g.deferred };

  function possibleBeneficiaries(c) {

    const out = ins ? [{ id: "insured", display: "Ass. - " + ins.name, name: ins.name, type: "ASSURE" }] : [];
    for (const l of c.linkedParties) if (l.type !== 2)
      out.push({ id: l.id, display: L.linkedPrefix[l.type] + l.lastName, name: l.lastName, type: { 1: "RENEUR", 3: "EDP", 4: "CDG", 5: "AUTRE" }[l.type] });
    return out;
  }
  const benPrefix = { ASSURE: "Ass. - ", RENEUR: "Ren. - ", EDP: "Ent. DP - ", CDG: "CdG. - ", AUTRE: "Autre - " };
  function benLabel(c, e, b) {
    const st = e.stances.find((s) => s.id === b.stanceId);
    const cv = st && c.coverages.find((x) => x.id === st.coverageId);
    return { who: (benPrefix[b.type] || "") + b.name, what: cv ? `Contrat ${cv.policyNumber} ${cv.coverageType}` : b.guarantee || "" };
  }

  /* ---------- Messages, dialogues ---------- */
  let toastTimer;
  function toast(msg, kind) {
    const t = $("#toast"); t.textContent = msg; t.className = "toast show " + (kind || "");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), kind === "err" ? 6000 : 3200);
  }
  const dlg = () => $("#dlg");
  function closeDlg() { const d = dlg(); if (d.open) d.close(); d.innerHTML = ""; }
  function confirmBox(text, label, cb) {
    const d = dlg();
    d.innerHTML = `<div class="dlg-body"><h3>Confirmer</h3><p>${h(text)}</p></div>
      <div class="dlg-foot"><button class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn danger" id="dlg-ok">${h(label)}</button></div>`;
    $("#dlg-ok", d).onclick = () => { closeDlg(); cb(); };
    d.showModal();
  }
  function field(f) {
    const id = "f-" + f.key, v = f.value == null ? "" : f.value;
    const req = f.required ? " required" : "";
    let ctl;
    if (f.type === "select")
      ctl = `<select id="${id}" name="${f.key}"${req}>${f.empty === false ? "" : `<option value="">${h(f.placeholder || "—")}</option>`}${f.options.map((o) => { const ov = typeof o === "object" ? o.value : o, ol = typeof o === "object" ? o.label : o; return `<option value="${h(ov)}"${String(ov) === String(v) ? " selected" : ""}>${h(ol)}</option>`; }).join("")}</select>`;
    else if (f.type === "textarea") ctl = `<textarea id="${id}" name="${f.key}" rows="3"${req}>${h(v)}</textarea>`;
    else if (f.type === "checks")
      ctl = `<div class="checks">${f.options.map((o) => `<label><input type="checkbox" name="${f.key}" value="${h(o.value)}"${(f.value || []).includes(o.value) ? " checked" : ""}> ${h(o.label)}</label>`).join("") || '<span class="muted">Aucun élément</span>'}</div>`;
    else if (f.type === "check") ctl = `<label class="inline"><input type="checkbox" id="${id}" name="${f.key}"${v ? " checked" : ""}> ${h(f.checkLabel || "Oui")}</label>`;
    else ctl = `<input id="${id}" name="${f.key}" type="${f.type === "date" ? "date" : "text"}"${f.type === "num" ? ' inputmode="decimal" class="num"' : ""} value="${h(f.type === "num" ? (blank(v) ? "" : String(v).replace(".", ",")) : v)}"${req}${f.list ? ` list="${f.list}"` : ""}${f.readonly ? " readonly" : ""}>`;
    return `<div class="fld${f.wide ? " wide" : ""}" data-key="${f.key}"><label for="${id}">${h(f.label)}${f.required ? ' <span class="req">*</span>' : ""}</label>${ctl}${f.hint ? `<small>${h(f.hint)}</small>` : ""}</div>`;
  }
  // Formulaire générique en fenêtre modale. onSubmit renvoie un message d'erreur ou rien.
  function openForm(o) {
    const d = dlg();
    d.innerHTML = `<form method="dialog" id="dlg-form" novalidate><div class="dlg-body"><h3>${h(o.title)}</h3>${o.intro ? `<p class="muted">${h(o.intro)}</p>` : ""}
      <div class="grid">${o.fields.map(field).join("")}</div><div id="dlg-extra">${o.extra || ""}</div><p class="form-err" id="dlg-err" hidden></p></div>
      <div class="dlg-foot"><button type="button" class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn primary" type="submit">${h(o.submit || "Enregistrer")}</button></div></form>`;
    const form = $("#dlg-form", d);
    const read = () => {
      const v = {}; let err = "";
      for (const f of o.fields) {
        if (f.type === "checks") { v[f.key] = [...form.querySelectorAll(`[name="${f.key}"]:checked`)].map((x) => x.value); continue; }
        const el = form.querySelector(`[name="${f.key}"]`);
        if (f.type === "check") { v[f.key] = el.checked; continue; }
        let val = el.value.trim();
        if (f.type === "num") {
          const p = parseNum(val);
          if (p === undefined) err = err || `La valeur saisie '${val}' n'est pas valide (${f.label})`;
          else if (p !== null && p < (f.min == null ? 0 : f.min)) err = err || `${f.label} : la valeur doit être supérieure ou égale à ${f.min == null ? 0 : f.min}`;
          else if (p !== null && f.max != null && p > f.max) err = err || `${f.label} : la valeur doit être inférieure ou égale à ${f.max}`;
          val = p === undefined ? null : p;
        }
        if (f.required && blank(val)) err = err || `${f.label} est obligatoire`;
        v[f.key] = val;
      }
      return { v, err };
    };
    if (o.onInput) { form.addEventListener("input", (ev) => o.onInput(read().v, form, ev)); form.addEventListener("change", (ev) => o.onInput(read().v, form, ev)); o.onInput(read().v, form, null); }
    form.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const { v, err } = read();
      const e2 = err || o.onSubmit(v, form);
      if (e2) { const p = $("#dlg-err", d); p.textContent = e2; p.hidden = false; return; }
      closeDlg(); save(); render();
    });
    d.showModal();
    const first = form.querySelector("input:not([readonly]),select,textarea"); if (first) first.focus();
  }

  /* ---------- Rendu ---------- */
  const STEPS = [["infos", "Infos générales"], ["parties", "Parties prenantes"], ["lieux", "Localisations"], ["estimations", "Estimations"],
    ["dommages", "Dommages"], ["garanties", "Garanties"], ["beneficiaires", "Bénéficiaires"], ["indemnisations", "Indemnisations"], ["synthese", "Synthèse"]];
  const statusPill = (s) => `<span class="pill s-${STATUS[s].cat.slice(0, 3).toLowerCase()}">${h(STATUS[s].label)}</span>`;

  function render() {
    const keep = document.activeElement && document.activeElement.id;
    const c = cur();
    if (ui.view === "case" && !c) ui.view = "home";
    $("#crumb").innerHTML = ui.view === "case" ? `<button class="link" data-act="home">Dossiers</button><span>/</span><strong>${h(c.number || "Sans numéro")}</strong>${c.demo ? '<span class="pill s-bro">Exemple</span>' : ""}` : ui.view === "refs" ? `<button class="link" data-act="home">Dossiers</button><span>/</span><strong>Référentiels</strong>` : "";
    $("#steps").hidden = ui.view !== "case";
    if (ui.view === "case") {
      $("#steps").innerHTML = STEPS.map(([k, label], i) => `<button class="step${ui.step === k ? " on" : ""}" data-act="step" data-step="${k}"><i>${i + 1}</i>${label}</button>`).join("");
    }
    const m = $("#main");
    m.innerHTML = (!storageOk ? `<p class="banner warn">Le stockage du navigateur est indisponible : vos saisies seront perdues à la fermeture de la page. Exportez le dossier en JSON pour le conserver.</p>` : "") +
      (ui.view === "home" ? vHome() : ui.view === "refs" ? vRefs() : vCase(c));
    if (keep) { const el = document.getElementById(keep); if (el) { el.focus(); if (el.select && el.tagName === "INPUT" && el.type === "text") el.select(); } }
    const on = $("#steps .on"); if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function caseTotals(c) {
    const e = c.estimates.find((x) => x.id === c.referenceEstimateId) || c.estimates[0];
    return e ? { e, ttc: r2(EC.sum(e.damages, (d) => d.priceWithVAT)) } : { e: null, ttc: 0 };
  }
  function vHome() {
    const cards = db.cases.map((c) => {
      const t = caseTotals(c), ins = insured(c);
      return `<article class="case-card"><button class="case-open" data-act="open-case" data-id="${c.id}">
        <span class="case-num">${h(c.number || "Sans numéro")}${c.demo ? ' <span class="pill s-bro">Exemple</span>' : ""}</span>
        <span class="muted">${h(c.type || "")} · sinistre du ${h(frDate(c.eventDate)) || "?"}</span>
        <span>${h(ins ? ins.name : "Assuré non renseigné")}</span>
        <span class="case-amt">${t.e ? eur(t.ttc) + " TTC" : "Aucune estimation"} ${t.e ? statusPill(t.e.status) : ""}</span></button>
        <div class="row-actions"><button class="btn sm ghost" data-act="export-case" data-id="${c.id}">Exporter JSON</button><button class="btn sm ghost danger-t" data-act="del-case" data-id="${c.id}">Supprimer</button></div></article>`;
    }).join("");
    return `<section class="head"><div><h1>Dossiers</h1><p class="muted">Chiffrage des dommages et calcul de l'indemnisation. Les données restent dans ce navigateur.</p></div>
      <div class="actions"><button class="btn primary" data-act="new-case">Nouveau dossier</button><label class="btn ghost" for="imp-case">Importer un dossier<input type="file" id="imp-case" accept=".json,application/json" hidden></label>
      <button class="btn ghost" data-act="refs">Référentiels</button></div></section>
      ${cards ? `<div class="cases">${cards}</div>` : `<div class="empty"><p>Aucun dossier. Créez-en un, ou chargez le dossier d'exemple pour parcourir toutes les étapes.</p><button class="btn" data-act="load-demo">Charger le dossier d'exemple</button></div>`}
      ${cards && !db.cases.some((c) => c.demo) ? `<p><button class="link" data-act="load-demo">Charger le dossier d'exemple</button></p>` : ""}`;
  }

  function vCase(c) {
    if (!c.estimates.length) { c.estimates.push(newEstimate(c)); c.referenceEstimateId = c.estimates[0].id; save(); }
    if (!est() || est().id !== ui.estId) ui.estId = (c.estimates.find((e) => e.id === c.referenceEstimateId) || c.estimates[0]).id;
    const needsEst = ["dommages", "garanties", "beneficiaires", "indemnisations", "synthese"].includes(ui.step);
    const e = est();
    const bar = needsEst ? `<div class="estbar"><label for="est-sel">Estimation</label><select id="est-sel" data-chg="est-sel">${c.estimates.map((x) => `<option value="${x.id}"${x.id === e.id ? " selected" : ""}>${h(x.name)}${x.id === c.referenceEstimateId ? " (référence)" : ""}</option>`).join("")}</select>${statusPill(e.status)}
      ${readOnly() ? `<span class="lock">Estimation verrouillée : dupliquez-la pour la modifier. <button class="link" data-act="dup-est" data-id="${e.id}">Dupliquer</button></span>` : ""}</div>` : "";
    const v = { infos: vInfos, parties: vParties, lieux: vLieux, estimations: vEstimations, dommages: vDommages, garanties: vGaranties, beneficiaires: vBeneficiaires, indemnisations: vIndemn, synthese: vSynthese }[ui.step](c, e);
    const i = STEPS.findIndex((s) => s[0] === ui.step);
    return bar + v + `<nav class="pager">${i > 0 ? `<button class="btn ghost" data-act="step" data-step="${STEPS[i - 1][0]}">← ${STEPS[i - 1][1]}</button>` : "<span></span>"}${i < STEPS.length - 1 ? `<button class="btn primary" data-act="step" data-step="${STEPS[i + 1][0]}">Étape suivante : ${STEPS[i + 1][1]} →</button>` : ""}</nav>`;
  }

  const inp = (id, chg, val, attrs) => `<input id="${id}" data-chg="${chg}" value="${h(val)}" ${attrs || ""}>`;
  const sel = (id, chg, opts, val, attrs) => `<select id="${id}" data-chg="${chg}" ${attrs || ""}>${opts.map((o) => { const ov = typeof o === "object" ? o.value : o, ol = typeof o === "object" ? o.label : o; return `<option value="${h(ov)}"${String(ov) === String(val == null ? "" : val) ? " selected" : ""}>${h(ol)}</option>`; }).join("")}</select>`;
  const toggle = (id, chg, on, a, b, dis) => `<span class="seg" role="group"><button id="${id}-0" class="${!on ? "on" : ""}" data-act="${chg}" data-v="0"${dis ? " disabled" : ""}>${a}</button><button id="${id}-1" class="${on ? "on" : ""}" data-act="${chg}" data-v="1"${dis ? " disabled" : ""}>${b}</button></span>`;

  function vInfos(c) {
    const f = (k, label, ctl, wide) => `<div class="fld${wide ? " wide" : ""}"><label for="ci-${k}">${label}</label>${ctl}</div>`;
    return `<section class="head"><div><h1>Informations générales</h1></div></section><div class="panel"><div class="grid">
      ${f("number", "N° de mission", inp("ci-number", "case", c.number || "", 'data-k="number" placeholder="27FP…"'))}
      ${f("type", "Type de sinistre", sel("ci-type", "case", [""].concat(L.caseTypes), c.type, 'data-k="type"'))}
      ${f("eventDate", "Date du sinistre", inp("ci-eventDate", "case", c.eventDate || "", 'data-k="eventDate" type="date"'))}
      ${f("expert", "Expert", inp("ci-expert", "case", c.expert || "", 'data-k="expert"'))}
      ${f("address", "Adresse du sinistre", inp("ci-address", "case", c.address || "", 'data-k="address"'), true)}
      ${f("department", "Département", inp("ci-department", "case", c.department || "", 'data-k="department" maxlength="3"'))}
      ${f("zone", "Zone tarifaire du bordereau", sel("ci-zone", "case", [1, 2, 3, 4, 5], c.zone || 1, 'data-k="zone" data-num="1"'))}
      ${f("irsi", "Convention IRSI", toggle("ci-irsi", "case-irsi", c.irsiEnabled, "non", "oui"))}
      ${f("comments", "Commentaires", `<textarea id="ci-comments" data-chg="case" data-k="comments" rows="3">${h(c.comments || "")}</textarea>`, true)}
    </div></div>`;
  }

  const tbl = (head, rows, empty) => `<div class="tw"><table><thead><tr>${head.map((x) => `<th${/€|%|Montant|Qté|Prix|Plafond|TVA/.test(x) ? ' class="r"' : ""}>${x}</th>`).join("")}</tr></thead><tbody>${rows || `<tr><td colspan="${head.length}" class="muted">${empty}</td></tr>`}</tbody></table></div>`;
  const rowBtns = (kind, id) => `<td class="acts"><button class="btn sm ghost" data-act="edit-${kind}" data-id="${id}">Modifier</button><button class="btn sm ghost danger-t" data-act="del-${kind}" data-id="${id}">Supprimer</button></td>`;
  const sect = (title, addAct, addLabel, body, note) => `<section class="panel"><div class="panel-h"><h2>${title}</h2>${addAct ? `<button class="btn sm" data-act="${addAct}">${addLabel}</button>` : ""}</div>${note ? `<p class="muted">${note}</p>` : ""}${body}</section>`;

  function vParties(c) {
    return `<section class="head"><div><h1>Parties prenantes</h1></div></section>` +
      sect("Assuré et tiers", "edit-tp", "Ajouter un tiers", tbl(["Nom", "Rôle", "Qualité", "Assureur", "Contrat", "TVA %", ""],
        c.thirdParties.map((t) => `<tr><td>${h(t.name)} ${t.insured ? '<span class="pill s-ver">Assuré</span>' : ""}</td><td>${h(t.role)}</td><td>${h(t.type)}</td><td>${h(t.insurance)}</td><td>${h(t.contract)}</td><td class="r">${pct(t.vat)}</td>${rowBtns("tp", t.id)}</tr>`).join(""), "Aucun tiers. Ajoutez l'assuré pour commencer le chiffrage.")) +
      sect("Objets de risque", "edit-ro", "Ajouter un objet de risque", tbl(["Type", "Adresse", ""],
        c.riskObjects.map((r) => `<tr><td>${h(r.riskType)}</td><td>${h([r.address1, r.postalCode, r.city].filter(Boolean).join(" "))}</td>${rowBtns("ro", r.id)}</tr>`).join(""), "Aucun objet de risque.")) +
      sect("Contrats et garanties", "edit-cov", "Ajouter une garantie", tbl(["Contrat", "Garantie", "Précision", "Assureur", "Objets couverts", ""],
        c.coverages.map((v) => `<tr><td>${h(v.policyNumber)}</td><td>${h([v.coverageType, v.complementary].filter(Boolean).join(" · "))}</td><td>${h(v.precision)}</td><td>${h(v.insurerLabel)}</td><td>${v.coveredRiskObjects.length ? v.coveredRiskObjects.map((id) => h(roLabel(c, id))).join("<br>") : "Tous"}</td>${rowBtns("cov", v.id)}</tr>`).join(""), "Aucune garantie saisie."),
        "Si des garanties sont saisies, une prise de position est demandée avant l'indemnisation. Sans garantie, le bénéficiaire est rattaché à une garantie choisie dans une liste.") +
      sect("Parties liées à l'assuré", "edit-lp", "Ajouter une partie liée", tbl(["Type", "Nom", ""],
        c.linkedParties.map((l) => `<tr><td>${h(L.linkedTypes[l.type])}</td><td>${h([l.lastName, l.firstName].filter(Boolean).join(" "))}</td>${rowBtns("lp", l.id)}</tr>`).join(""), "Aucune partie liée."),
        "Réparateurs agréés, entreprises en délégation de paiement et centres de gestion peuvent être bénéficiaires d'une indemnité.");
  }

  function vLieux(c) {
    const cards = c.rooms.map((r) => {
      const m = EC.roomMeasures(r);
      return `<article class="room"><div class="panel-h"><h3>${h(r.name)} <span class="muted">${h(r.roomType)}</span></h3><div><button class="btn sm ghost" data-act="edit-room" data-id="${r.id}">Modifier</button><button class="btn sm ghost danger-t" data-act="del-room" data-id="${r.id}">Supprimer</button></div></div>
        <p class="dims">${qty(m.length)} × ${qty(m.width)} m, hauteur ${qty(m.height)} m</p>
        <dl class="kv"><div><dt>Sol</dt><dd>${n2(m.floor)} m²</dd></div><div><dt>Plafond</dt><dd>${n2(m.ceiling)} m²</dd></div><div><dt>Murs, ouvertures déduites</dt><dd>${n2(m.walls)} m²</dd></div><div><dt>Périmètre</dt><dd>${n2(m.perimeter)} ml</dd></div><div><dt>Plinthes</dt><dd>${n2(m.skirting)} ml</dd></div><div><dt>Volume</dt><dd>${n2(m.volume)} m3</dd></div></dl>
        <div class="openings">${(r.openings || []).map((o, i) => `<span class="chip">${h(o.type)} ${qty(o.width)} × ${qty(o.height)} m <button data-act="del-opening" data-id="${r.id}" data-i="${i}" aria-label="Retirer">×</button></span>`).join("")}<button class="btn sm ghost" data-act="add-opening" data-id="${r.id}">+ Ouverture</button></div></article>`;
    }).join("");
    return `<section class="head"><div><h1>Localisations</h1><p class="muted">Les mesures calculées se reprennent en quantité dans les lignes de dommages.</p></div><div class="actions"><button class="btn primary" data-act="edit-room">Ajouter une pièce</button></div></section>
      ${cards ? `<div class="rooms">${cards}</div>` : `<div class="empty"><p>Aucune pièce. Cette étape est facultative.</p></div>`}`;
  }

  function vEstimations(c) {
    const rows = c.estimates.map((e) => {
      const ht = r2(EC.sum(e.damages, (d) => d.priceNoVAT)), ttc = r2(EC.sum(e.damages, (d) => d.priceWithVAT));
      const ro = EC.isReadOnly(e.status);
      return `<tr><td><strong>${h(e.name)}</strong> ${e.id === c.referenceEstimateId ? '<span class="pill s-ver">Référence</span>' : ""}</td><td>${statusPill(e.status)}<br><small class="muted">${h(frDate(e.statusDate))}</small></td><td class="r">${e.damages.length}</td><td class="r">${eur(ht)}</td><td class="r">${eur(ttc)}</td>
        <td class="r"><input id="de-${e.id}" class="num" inputmode="decimal" data-chg="damage-estimate" data-id="${e.id}" value="${n2(e.damageEstimate)}"${ro ? " disabled" : ""} aria-label="Évaluation des dommages"></td>
        <td class="acts"><button class="btn sm" data-act="open-est" data-id="${e.id}">Ouvrir</button><button class="btn sm ghost" data-act="dup-est" data-id="${e.id}">Dupliquer</button>${e.id !== c.referenceEstimateId ? `<button class="btn sm ghost" data-act="ref-est" data-id="${e.id}">Définir en référence</button>` : ""}${c.estimates.length > 1 ? `<button class="btn sm ghost danger-t" data-act="del-est" data-id="${e.id}">Supprimer</button>` : ""}</td></tr>`;
    }).join("");
    return `<section class="head"><div><h1>Estimations</h1><p class="muted">L'évaluation des dommages sert quand aucun chiffrage détaillé n'est saisi.</p></div><div class="actions"><button class="btn primary" data-act="add-est">Nouvelle estimation</button></div></section>
      <section class="panel">${tbl(["Estimation", "Statut", "Lignes", "Total HT €", "Total TTC €", "Évaluation des dommages €", ""], rows, "")}</section>`;
  }

  /* ----- Dommages ----- */
  function dmgScope(c, e) {
    if (!c.thirdParties.some((t) => t.id === ui.tpId)) ui.tpId = (insured(c) || c.thirdParties[0] || {}).id || null;
    const tp = c.thirdParties.find((t) => t.id === ui.tpId);
    if (tp && tp.insured) { if (!c.riskObjects.some((r) => r.id === ui.roId)) ui.roId = (c.riskObjects[0] || {}).id || null; }
    const roId = tp && tp.insured ? ui.roId : null;
    return { tp, roId, calc: tp ? getCalc(e, tp.id, roId, false) : null };
  }
  const scopeDamages = (e, tp, roId) => e.damages.filter((d) => d.thirdPartyId === tp.id && (!tp.insured || (d.riskObjectId || null) === (roId || null)));

  function vDommages(c, e) {
    const { tp, roId, calc } = dmgScope(c, e);
    if (!tp) return `<section class="head"><div><h1>Dommages</h1></div></section><div class="empty"><p>Ajoutez d'abord l'assuré dans les parties prenantes.</p><button class="btn" data-act="step" data-step="parties">Parties prenantes</button></div>`;
    if (tp.insured && !c.riskObjects.length) return `<section class="head"><div><h1>Dommages</h1></div></section><div class="empty"><p>Ajoutez un objet de risque : les dommages de l'assuré y sont rattachés.</p><button class="btn" data-act="step" data-step="parties">Parties prenantes</button></div>`;
    const ro = readOnly(), k = calc || { taxRegime: true, includedInIRSI: true, claimedAmount: null };
    const all = scopeDamages(e, tp, roId);
    const list = all.filter((d) => (ui.tab === "mbv") === (d.l1 === MBV)).sort((a, b) => (a.lineIndex < b.lineIndex ? -1 : 1));
    const dis = ro ? " disabled" : "";
    const top = `<section class="head"><div><h1>Dommages</h1></div><div class="actions">${ui.tab === "prest" ? `<button class="btn" data-act="import-doc"${dis}>Importer un devis ou une facture</button>` : ""}<button class="btn primary" data-act="${ui.tab === "mbv" ? "edit-mbv" : "edit-dmg"}"${dis}>${ui.tab === "mbv" ? "Ajouter un bien" : "Ajouter une prestation"}</button></div></section>
      <div class="filters"><div class="fld"><label for="dm-tp">Tiers</label>${sel("dm-tp", "dm-tp", c.thirdParties.map((t) => ({ value: t.id, label: t.name + (t.insured ? " (assuré)" : "") })), tp.id)}</div>

  function zonePrice(p, c) { return p.prices[(c.zone || 1) - 1]; }

  /* ----- Garanties ----- */
