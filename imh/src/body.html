<header class="top">
  <div class="wrap top-row">
    <button class="logo" type="button" data-act="tab" data-v="dossier"><i></i>Chiffrage IMH</button>
    <label class="pick"><span class="sr">Dossier</span><select id="dossier-pick" aria-label="Dossier ouvert"></select></label>
    <div class="actions">
      <button class="btn sm" type="button" data-act="new">Nouveau dossier</button>
      <button class="btn sm ghost" type="button" data-act="dup">Dupliquer</button>
      <button class="btn sm ghost" type="button" data-act="import-json">Importer</button>
      <button class="btn sm ghost" type="button" data-act="export-json">Exporter</button>
    </div>
  </div>
  <div class="wrap strip" id="strip"></div>
  <nav class="wrap tabs" id="tabs" aria-label="Sections du chiffrage"></nav>
</header>
<main class="wrap" id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<input type="file" id="file-csv" accept=".csv,text/csv,text/plain" hidden>
