<title>Eureka Chiffrage nouvelle version</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Mise en page : barre de dossier sombre et fixe (onglets + chiffres en direct), puis l'onglet actif ; plan sur papier quadrillé, cotes en jaune mètre-ruban */
:root {
  --bg: #EEF1F5; --surface: #FFFFFF; --surface-2: #F6F8FA; --sunken: #E5E9EF; --line: #DCE1E8; --line-2: #C6CDD8;
  --ink: #0D1726; --ink-2: #4A576B; --ink-3: #7F8A9C;
  --accent: #2349E6; --accent-ink: #FFFFFF; --accent-soft: #E7ECFE; --accent-text: #1735B3;
  --tape: #F4B400; --tape-ink: #2B2100; --tape-soft: #FFF4CC;
  --carbon: #0E8159; --carbon-soft: #DFF3EA;
  --ok: #17703F; --ok-bg: #E1F2E8; --warn: #8A5200; --warn-bg: #FFF0D6; --bad: #B4231B; --bad-bg: #FDE7E5;
  --bar: #0D1726; --bar-2: #18243A; --bar-ink: #FFFFFF; --bar-mute: #9AA6BA; --bar-line: #26344D;
  --paper: #FBFCFD; --grid: rgba(35, 73, 230, .07); --grid-major: rgba(35, 73, 230, .14);
  --wall: #0D1726; --room: #FFFFFF; --room-sel: #E7ECFE;
  --shadow: 0 1px 2px rgba(13, 23, 38, .06), 0 10px 30px rgba(13, 23, 38, .07);
  --font: "Inter", "Segoe UI", system-ui, sans-serif;
  --display: "Space Grotesk", "Inter", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A101C; --surface: #111A2A; --surface-2: #152035; --sunken: #1C2840; --line: #223048; --line-2: #33425F;
    --ink: #E9EEF6; --ink-2: #A5B0C3; --ink-3: #707C92;
    --accent: #7B97FF; --accent-ink: #0A1230; --accent-soft: #1A2650; --accent-text: #BBCAFF;
    --tape: #FFC933; --tape-ink: #2B2100; --tape-soft: #3A3011;
    --carbon: #52D3A2; --carbon-soft: #0F3127;
    --ok: #86D9A6; --ok-bg: #12301F; --warn: #F4C576; --warn-bg: #36290F; --bad: #FF8E85; --bad-bg: #3A1614;
    --bar: #060B15; --bar-2: #0F1828; --bar-ink: #FFFFFF; --bar-mute: #8B97AC; --bar-line: #1E2A41;
    --paper: #0E1625; --grid: rgba(123, 151, 255, .07); --grid-major: rgba(123, 151, 255, .15);
    --wall: #E9EEF6; --room: #131D30; --room-sel: #1A2650;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A101C; --surface: #111A2A; --surface-2: #152035; --sunken: #1C2840; --line: #223048; --line-2: #33425F;
  --ink: #E9EEF6; --ink-2: #A5B0C3; --ink-3: #707C92;
  --accent: #7B97FF; --accent-ink: #0A1230; --accent-soft: #1A2650; --accent-text: #BBCAFF;
  --tape: #FFC933; --tape-ink: #2B2100; --tape-soft: #3A3011;
  --carbon: #52D3A2; --carbon-soft: #0F3127;
  --ok: #86D9A6; --ok-bg: #12301F; --warn: #F4C576; --warn-bg: #36290F; --bad: #FF8E85; --bad-bg: #3A1614;
  --bar: #060B15; --bar-2: #0F1828; --bar-ink: #FFFFFF; --bar-mute: #8B97AC; --bar-line: #1E2A41;
  --paper: #0E1625; --grid: rgba(123, 151, 255, .07); --grid-major: rgba(123, 151, 255, .15);
  --wall: #E9EEF6; --room: #131D30; --room-sel: #1A2650;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: -.015em; text-wrap: balance; }
h2 { font-size: 20px; } h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1480px; margin: 0 auto; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); } .small { font-size: 12.5px; } .num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.r { text-align: right; }

/* barre du dossier */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bar); color: var(--bar-ink); }
.bar::after { content: ""; display: block; height: 3px; background: linear-gradient(90deg, #2349E6, #7B97FF 45%, #F4B400 75%, #3CC57C); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 16px var(--display); white-space: nowrap; }
.brand svg { flex: none; }
.case { display: flex; flex-direction: column; min-width: 0; font-size: 12.5px; color: var(--bar-mute); }
.case b { color: var(--bar-ink); font: 600 13px var(--mono); letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; background: var(--bar-2); border: 1px solid var(--bar-line); border-radius: 12px; padding: 4px; overflow-x: auto; max-width: 100%; }
.tabs a { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 9px; color: var(--bar-mute); text-decoration: none; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.tabs a:hover { color: var(--bar-ink); }
.tabs a[aria-current="page"] { background: var(--bar-ink); color: var(--bar); }
.tabs .st { width: 7px; height: 7px; border-radius: 50%; background: var(--tape); flex: none; }
.tabs .st.ok { background: #3CC57C; }
.dock { margin-left: auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.fig { display: flex; flex-direction: column; line-height: 1.15; }
.fig span { font-size: 11px; color: var(--bar-mute); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.fig b { font: 600 19px var(--display); font-variant-numeric: tabular-nums; }
.fig.co2 b { color: #6FE0B4; }
.ring { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--bar-ink); }
.ring small { display: block; font-size: 11px; color: var(--bar-mute); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.ring strong { font-size: 13px; font-weight: 600; }
.bar-btn { border: 1px solid var(--bar-line); background: transparent; color: var(--bar-ink); border-radius: 9px; padding: 7px 11px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.bar-btn:hover { background: var(--bar-2); }
.bar-btn[disabled] { opacity: .4; cursor: default; }

/* structure commune */
main { padding-block: 22px 60px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 16px; }
.page-head h1 { font-size: 26px; }
.page-head p { max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.pad { padding: 18px; }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 8px 13px; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-text); padding-inline: 6px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip small { font-weight: 500; opacity: .75; font-size: 12px; }
.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 2px 7px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.tag.nat { background: var(--accent-soft); color: var(--accent-text); }
.tag.src { background: var(--sunken); color: var(--ink-2); }
.tag.plan { background: var(--tape-soft); color: var(--warn); }
.tag.co2 { background: var(--carbon-soft); color: var(--carbon); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.inp { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 7px 10px; min-width: 0; width: 100%; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.num, .inp.mono { text-align: right; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 500; max-width: min(560px, calc(100vw - 32px)); transition: opacity .2s, transform .2s; z-index: 20; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.empty { border: 1.5px dashed var(--line-2); border-radius: 14px; padding: 18px; color: var(--ink-2); }

/* Localisation */
.loc { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.canvas { overflow: hidden; display: flex; flex-direction: column; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tool { border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 7px 10px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.tool:hover { background: var(--surface-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.tools .sep { width: 1px; height: 22px; background: var(--line); margin-inline: 4px; }
.floors { display: flex; gap: 6px; margin-left: auto; }
.stage { position: relative; height: 600px; background: var(--paper); }
#plan-svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage-hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--ink-3); background: var(--paper); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 700; }
.naming { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); width: min(440px, calc(100% - 24px)); padding: 16px; display: flex; flex-direction: column; gap: 12px; z-index: 2; }
.naming .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.side { display: flex; flex-direction: column; gap: 14px; }
.side .card { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.metric { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.metric span { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.metric b { font: 600 15px var(--mono); }
.walls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.wall-row { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 4px 4px 4px 8px; background: var(--surface); }
.wall-row.sel { border-color: var(--tape); box-shadow: 0 0 0 2px var(--tape-soft); }
.wall-row button { border: 0; background: none; padding: 0; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.wall-row input { border: 0; background: var(--tape-soft); border-radius: 7px; padding: 4px 6px; width: 100%; min-width: 0; text-align: right; font: 600 13px var(--mono); color: var(--ink); }
.wall-row input:focus { outline: 2px solid var(--tape); }
.alert { border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.ok { background: var(--ok-bg); color: var(--ok); }
.alert.info { background: var(--accent-soft); color: var(--accent-text); }
.alert .btn { margin-left: auto; flex: none; }
.open-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px 28px; gap: 6px; align-items: center; font-size: 13px; }
.open-row .inp { padding: 5px 7px; font: 500 12.5px var(--mono); text-align: right; }
.x { border: 0; background: none; color: var(--ink-3); font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.x:hover { background: var(--bad-bg); color: var(--bad); }
#elev-svg { width: 100%; height: auto; display: block; touch-action: none; background: var(--surface-2); border-radius: 10px; border: 1px solid var(--line); cursor: crosshair; }
.model { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.model b { font-size: 13.5px; }

/* SVG du plan */
.p-room { fill: var(--room); stroke: none; cursor: pointer; }
.p-room.sel { fill: var(--room-sel); }
.p-wall { stroke: var(--wall); stroke-width: 11; stroke-linecap: square; fill: none; }
.p-wall.sel { stroke: var(--tape); }
.p-hit { stroke: transparent; stroke-width: 34; fill: none; cursor: pointer; }
.p-sym { stroke: var(--wall); stroke-width: 1.6; fill: none; vector-effect: non-scaling-stroke; }
.p-glass { stroke: var(--accent); stroke-width: 3; fill: none; }
.p-name { font: 600 21px var(--font); fill: var(--ink); text-anchor: middle; pointer-events: none; }
.p-area { font: 500 17px var(--mono); fill: var(--ink-2); text-anchor: middle; pointer-events: none; }
.p-dim { stroke: var(--ink-2); stroke-width: 1.2; vector-effect: non-scaling-stroke; fill: none; }
.p-cote rect { fill: var(--tape); }
.p-cote text { font: 600 17px var(--mono); fill: var(--tape-ink); text-anchor: middle; }
.p-cote { cursor: pointer; }
.p-cote:hover rect, .p-cote.sel rect { fill: var(--ink); }
.p-cote:hover text, .p-cote.sel text { fill: var(--surface); }
.p-gap { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 8 6; fill: none; }
.p-gap-dot { fill: var(--bad); }
.p-zone { fill: url(#hatch); stroke: var(--bad); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.p-stroke { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.p-ghost { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; }
.p-heat { stroke: var(--wall); stroke-width: 6; }
.p-heat-t { font: 600 30px var(--mono); fill: var(--ink); text-anchor: middle; }
.p-heat-n { font: 600 30px var(--font); fill: var(--ink); text-anchor: middle; }
.hatch-l { stroke: var(--bad); stroke-width: 2; }
.e-wall { fill: var(--surface); stroke: var(--ink-2); stroke-width: 2; vector-effect: non-scaling-stroke; }
.e-open { fill: var(--surface-2); stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.e-txt { font: 500 15px var(--mono); fill: var(--ink-2); }

/* Estimations */
.est { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.est-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.targets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cmd { position: relative; }
.cmd-box { display: flex; align-items: center; gap: 12px; padding: 6px 8px 6px 16px; border: 2px solid var(--accent); border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 5px var(--accent-soft); }
.cmd-box input { flex: 1; border: 0; background: transparent; font-size: 17px; padding: 10px 0; min-width: 0; outline: none; }
.kbd { font: 600 11.5px var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; color: var(--ink-2); background: var(--surface-2); }
.cmd-res { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 4; max-height: 470px; overflow: auto; padding: 8px; }
.res-h { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 8px 10px 4px; }
.res { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 11px; padding: 9px 10px; }
.res:hover, .res.on { background: var(--accent-soft); }
.res b { font-weight: 600; }
.res .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.res .amt { text-align: right; font: 600 13px var(--mono); }
.res .amt small { display: block; font: 500 11.5px var(--font); color: var(--ink-2); }
.hb { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 16px; border-color: var(--accent); }
.hb .wide { grid-column: span 3; }
.hb .full { grid-column: 1 / -1; }
.lines-card { overflow: hidden; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
.lines { min-width: 1120px; font-size: 13.5px; }
.lines th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; padding: 10px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.lines td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.lines tr.room-h td { background: var(--surface-2); font-weight: 600; padding-block: 8px; }
.lines tr.room-h .num { font-family: var(--mono); }
.lines tr.target td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.lines .name { font-weight: 600; }
.lines .sub { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.lines .cell-inp { width: 74px; border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; text-align: right; font: 500 13px var(--mono); background: var(--surface); }
.lines .cell-inp:focus { border-color: var(--accent); outline: none; }
.lines select.cell-inp { width: 72px; text-align: left; }
.lines .amt { font: 600 13.5px var(--mono); text-align: right; white-space: nowrap; }
.lines .q { font: 600 13.5px var(--mono); white-space: nowrap; }
.flag td { padding-top: 0 !important; border-bottom: 1px solid var(--line); }
.flag-in { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-radius: 10px; padding: 7px 10px; font-size: 13px; }
.flag-in.warn { background: var(--warn-bg); color: var(--warn); }
.flag-in.info { background: var(--accent-soft); color: var(--accent-text); }
.flag-in.bad { background: var(--bad-bg); color: var(--bad); }
.flag-in .btn { padding: 4px 10px; font-size: 12.5px; margin-left: auto; }
.alts { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.alt { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.delta { font: 600 13px var(--mono); text-align: right; white-space: nowrap; }
.delta .g { color: var(--carbon); }
.recap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: flex; flex-direction: column; gap: 14px; }
.recap .card { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.kv b { font-family: var(--mono); font-weight: 600; }
.big { font: 700 30px var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.meter { height: 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s; }
.meter.c i { background: var(--carbon); }
.issues { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
.issues li { display: flex; gap: 8px; align-items: flex-start; }

    let body = '<div class="dlg"><div class="dlg-head"><div style="flex:1;min-width:0"><h2>Importer un chiffrage</h2><div class="imp-steps">' + steps.map((x, i) => '<span class="' + (i < at ? "done" : i === at ? "now" : "") + '"><b>' + (i + 1) + "</b>" + x[1] + "</span>").join("") + '</div></div><button type="button" class="x" data-dlg="close" aria-label="Fermer">×</button></div>';
    if (im.step === "source") {
      body += '<label class="dropzone" id="imp-drop" for="imp-file"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M12 5h12l8 8v22H12z M24 5v8h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M22 30V19M17.5 23.5L22 19l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<b>Déposez un devis, une facture ou un chiffrage Excel</b><span class="muted small">glissez-le ici, ou cliquez pour choisir un fichier</span><span class="fmt"><i>PDF</i><i>XLSX</i><i>XLS</i><i>ODS</i><i>CSV</i><i>TXT</i></span>' +
        '<input type="file" id="imp-file" accept=".pdf,.xlsx,.xlsm,.xls,.ods,.csv,.txt,application/pdf,text/plain,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden></label>' +
        (im.busy ? '<div class="alert info"><span>' + esc(im.busy) + "</span></div>" : "") + (im.err ? '<div class="alert bad"><span>' + esc(im.err) + "</span></div>" : "") +
        '<details class="paste"><summary>Ou collez le texte du document</summary><textarea id="imp-text" aria-label="Texte du document" placeholder="Désignation    Qté   U   P.U. HT   Total HT"></textarea><div class="dlg-foot"><button type="button" class="btn" data-dlg="read">Lire le texte</button></div></details>' +
        '<div class="dlg-foot" style="justify-content:space-between"><span class="small muted">Lecture dans le navigateur, sans IA : le document n\'est envoyé nulle part.</span><span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-dlg="sample-text">Essayer un devis exemple</button><button type="button" class="btn" data-dlg="sample-xlsx">Essayer un chiffrage Excel exemple</button></span></div>';
    } else if (im.step === "map") {
      const hdrRow = im.rows[im.hdr.row], colName = (j) => "Colonne " + String.fromCharCode(65 + j) + (hdrRow[j] !== "" ? " · " + String(hdrRow[j]) : "");
      body += '<div class="alert ok"><span>' + esc(im.label) + " : en-têtes reconnus en ligne " + (im.hdr.row + 1) + ", " + im.items.length + " lignes chiffrées.</span></div>" +
        (im.sheets.length > 1 ? '<div class="field" style="max-width:320px"><label for="imp-sheet">Feuille</label><select class="inp" id="imp-sheet">' + im.sheets.map((s) => "<option" + (s === im.sheet ? " selected" : "") + ">" + esc(s) + "</option>").join("") + "</select></div>" : "") +
        '<p class="small muted">Vérifiez à quelle colonne correspond chaque information. Les colonnes Nature, Détail, Pièce et Vétusté sont reprises si le classeur les contient.</p>' +
        '<div class="map-grid">' + COLS.map((col) => '<div class="field"><label for="map-' + col.k + '">' + col.label + (col.k === "name" || col.k === "pu" ? " *" : "") + '</label><select class="inp" id="map-' + col.k + '" data-map="' + col.k + '"><option value="">Aucune</option>' + hdrRow.map((h, j) => '<option value="' + j + '"' + (im.hdr.map[col.k] === j ? " selected" : "") + ">" + esc(colName(j)) + "</option>").join("") + "</select></div>").join("") + "</div>" +
        '<div class="dlg-foot"><button type="button" class="btn" data-dlg="restart">Autre document</button><button type="button" class="btn primary" data-dlg="to-review">Voir les ' + im.items.length + " lignes</button></div>";
    } else {
      const items = im.items, sumL = r2(sumf(items, "total")), ok = im.totalHT != null && Math.abs(sumL - im.totalHT) < 0.02, nOn = items.filter((x) => x.on).length, missing = items.filter((x) => x.on && (!x.n || !x.d)).length;
      const opts = (o, v, f) => o.map((x) => '<option value="' + esc(x) + '"' + (x === v ? " selected" : "") + ">" + esc(f ? f(x) : x) + "</option>").join("");
      body += '<div class="alert ' + (items.length ? (ok ? "ok" : "warn") : "warn") + '"><span>' + esc(im.label || "Document") + " · " + items.length + " lignes · somme " + eur(sumL) + " HT" + (im.totalHT != null ? (ok ? " = total du document ✓" : " ≠ total du document " + eur(im.totalHT)) : " · total du document non trouvé") + "</span></div>" +
        (items.length ? '<div class="tw"><table class="imp"><thead><tr><th><input type="checkbox" data-imp="all"' + (nOn === items.length ? " checked" : "") + ' aria-label="Tout cocher"></th><th>Désignation</th><th>Pièce</th><th class="r">Qté</th><th class="r">P.U. HT</th><th class="r">TVA</th><th>Nature</th><th>Détail</th></tr></thead><tbody>' +
          items.map((x, i) => '<tr class="' + (x.on ? "" : "off") + '"><td><input type="checkbox" data-imp="on" data-i="' + i + '"' + (x.on ? " checked" : "") + ' aria-label="Intégrer la ligne"></td><td><b style="font-weight:600">' + esc(x.name) + "</b>" + (x.n === MBV ? '<div><span class="tag tape">mobilier</span></div>' : "") + (x.fromDoc ? '<div class="small faint">nature reprise du classeur</div>' : x.kw ? '<div class="small faint">proposé d\'après « ' + esc(x.kw) + " »</div>" : '<div class="small" style="color:var(--bad)">nature à choisir</div>') + (x.check ? '<div class="small" style="color:var(--warn)">quantité × prix ≠ total : à vérifier</div>' : "") + "</td>" +
            '<td><select data-imp="room" data-i="' + i + '" aria-label="Pièce">' + S.rooms.map((r) => '<option value="' + r.id + '"' + (r.id === x.room ? " selected" : "") + ">" + esc(r.name) + "</option>").join("") + "</select></td>" +
            '<td class="r mono">' + fr(x.qty) + " " + esc(x.unit) + '</td><td class="r mono">' + eur(x.pu) + '</td><td class="r mono">' + (x.vat == null ? "—" : fr(x.vat, 1).replace(",0", "") + " %") + "</td>" +
            '<td><select data-imp="n" data-i="' + i + '" aria-label="Nature"><option value="">Choisir…</option>' + opts(NAT_OPTS(), x.n, (v) => (v === MBV ? "Mobilier et biens volés" : v)) + '</select></td><td><select data-imp="d" data-i="' + i + '" aria-label="Détail"><option value="">Choisir…</option>' + (x.n ? opts(DET_OPTS(x.n), x.d) : "") + "</select></td></tr>").join("") + "</tbody></table></div>"
          : '<div class="alert warn"><span>Aucune ligne chiffrée reconnue. Chaque ligne doit porter une désignation et un prix (unitaire ou total).</span></div>') +
        '<p class="small muted" id="imp-err">' + (missing ? '<span style="color:var(--bad)">' + missing + " ligne(s) sans nature ou détail : Sinapps les exige.</span> " : "") + "Les biens mobiliers deviennent des lignes de mobilier (état et justificatif à compléter). TVA absente : 10 % pour les prestations, 20 % pour le mobilier.</p>" +
        '<div class="dlg-foot"><button type="button" class="btn" data-dlg="' + (im.kind === "excel" ? "back-map" : "restart") + '">' + (im.kind === "excel" ? "Revoir les colonnes" : "Autre document") + '</button><button type="button" class="btn primary" data-dlg="integrate"' + (nOn && !missing ? "" : " disabled") + ">Intégrer " + nOn + " ligne" + (nOn > 1 ? "s" : "") + "</button></div>";
    }
    d.innerHTML = body + "</div>";
  }
  function integrate() {
    const im = S.imp, items = im.items.filter((x) => x.on);
    document.getElementById("dlg").close();
    let nP = 0, nM = 0;
    if (mut(() => {
      items.forEach((x) => {
        if (x.n === MBV) {
          const cat = MBV_CATS[x.d] ? x.d : "Mobilier", ht = r2(x.total || x.pu * x.qty);
          S.lines.push({ id: S.nextId++, kind: "mbv", lineIndex: nextLineIndex(S.lines, MBV, cat), room: x.room, n: MBV, d: cat, name: x.name, goodStatus: "Non réparable", proof: "Justifiés en existence", brand: "", reference: "", purchaseDate: "", claimedAmount: ht, eqBrand: "", eqReference: "", ht, vat: x.vat == null ? 20 : x.vat, vet: x.vet || 0, obsIn: null, mode: "IP", beneficiaryName: "", co2: MBV_CATS[cat].co2, source: im.source, toCheck: true });
          nM++;
        } else {
          const cat = CAT.find((c) => norm(x.name).indexOf(norm(c.name.split(",")[0])) === 0);
          S.lines.push({ id: S.nextId++, lineIndex: nextLineIndex(S.lines, x.n, x.d), room: x.room, cat: null, name: x.name, n: x.n, d: x.d, unit: x.unit, link: null, qty: x.qty, pu: x.pu, vat: x.vat == null ? 10 : x.vat, vet: x.vet || 0, obsIn: null, mode: "IP", beneficiaryName: "", co2: cat ? cat.co2 : (x.n === "Immobilier" ? 2 : 4), source: im.source, bordereau: cat ? cat.pu : undefined });
          nP++;
        }
      });
    })) { if (nM && !nP) S.estView = "mbv"; render(); toast((nP ? nP + " prestation" + (nP > 1 ? "s" : "") : "") + (nP && nM ? " et " : "") + (nM ? nM + " bien" + (nM > 1 ? "s" : "") + " mobilier" + (nM > 1 ? "s" : "") : "") + " intégré" + (nP + nM > 1 ? "s" : "")); }
  }
  const dlg = document.getElementById("dlg");
  dlg.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-dlg]"); if (!b) return;
    const a = b.dataset.dlg, im = S.imp;
    if (a === "close") { dlg.close(); return; }
    if (a === "read") { const t = document.getElementById("imp-text").value.trim(); if (!t) { im.err = "Collez d'abord le texte du document."; drawImport(); return; } fromText(t, ""); return; }
    if (a === "sample-text") { fromText(SAMPLE, "Devis exemple"); return; }
    if (a === "sample-xlsx") {
      im.busy = "Préparation du classeur exemple…"; drawImport();
      try { const X = await xlsxLib(), wb = X.utils.book_new(); X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(sampleSheet()), "Chiffrage"); fromWorkbook(X.read(X.write(wb, { type: "array", bookType: "xlsx" }), { type: "array" }), "chiffrage-reno-services.xlsx"); }
      catch (err) { im.busy = null; im.err = "La bibliothèque Excel n'a pas pu être chargée (connexion requise)."; drawImport(); }
      return;
    }
    if (a === "restart") { S.imp = { step: "source" }; drawImport(); return; }
    if (a === "back-map") { im.step = "map"; drawImport(); return; }
    if (a === "to-review") { im.items = rowsToItems(im.rows, im.hdr); im.step = "review"; drawImport(); return; }
    if (a === "integrate") integrate();
  });
  dlg.addEventListener("change", (e) => {
    const el = e.target, im = S.imp;
    if (el.id === "imp-file" && el.files[0]) { readFile(el.files[0]); return; }
    if (el.id === "imp-sheet") { im.sheet = el.value; loadSheet(im.fileName); return; }
    if (el.dataset.map) { const v = el.value === "" ? null : +el.value; if (v == null) delete im.hdr.map[el.dataset.map]; else im.hdr.map[el.dataset.map] = v; im.items = rowsToItems(im.rows, im.hdr); drawImport(); return; }
    const k = el.dataset.imp; if (!k) return;
    if (k === "all") { im.items.forEach((x) => { x.on = el.checked; }); drawImport(); return; }
    const x = im.items[+el.dataset.i];
    if (k === "on") x.on = el.checked; if (k === "n") { x.n = el.value; x.d = ""; x.kw = ""; x.fromDoc = false; } if (k === "d") x.d = el.value; if (k === "room") x.room = el.value;
    drawImport();
  });
  ["dragover", "dragenter"].forEach((t) => document.addEventListener(t, (e) => { if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes("Files")) return; e.preventDefault(); if (!dlg.open) document.body.classList.add("dragging"); const z = document.getElementById("imp-drop"); if (z) z.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { if (t === "dragleave" && e.relatedTarget) return; document.body.classList.remove("dragging"); const z = document.getElementById("imp-drop"); if (z) z.classList.remove("over"); }));
  document.addEventListener("drop", (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (!f) return; e.preventDefault();
    if (dlg.open && S.imp) { readFile(f); return; }
    if (S.tab !== "estimations") location.hash = "estimations";
    openImport(f);
  });
  const SAMPLE = "RÉNO SERVICES SARL · Devis D-2026-0188 du 14/11/2026\nDésignation                                    Qté   U     P.U. HT    Total HT\nDépose et évacuation faïence murale            2,4   m²     18,50       44,40\nFaïence murale 20x20, fourniture et pose       2,4   m²     72,00      172,80\nRemplacement prise étanche                     2     U      52,00      104,00\nRecherche de fuite par caméra thermique        1     FFT   340,00      340,00\nTotal HT                                                              661,20\nTVA 10 %                                                               66,12\nTotal TTC                                                             727,32";

  // ventilation de départ : les lignes de l'assuré vers Camille Exemple, la peinture en réparation en nature vers Réno Services ; la recherche de fuite reste à ventiler
  function initComps() {
    const gs = groupsOf(calc());
    gs.forEach((g) => { if (g.l2 === "Recherche de fuite") return; assignGroup(g, g.mode === "REN" ? "b2" : "b1", S.genericPct, S.option); });
    storeGroups(gs);
  }
  initComps();
  window.addEventListener("hashchange", setTab);
  setTab();
})();
</script>
