<title>Eureka Chiffrage nouvelle génération</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Mise en page : application d'expert, en-tête fixe avec les 4 écrans du prototype, colonne de travail + récapitulatif à droite */
:root {
  --bg: #F3F4F8; --surface: #FFFFFF; --surface-2: #F7F8FB; --sunken: #E9EBF3; --line: #E2E4ED; --line-2: #D3D6E3;
  --ink: #14162B; --ink-2: #555B77; --ink-3: #868BA6;
  --accent: #3451D1; --accent-ink: #FFFFFF; --accent-soft: #ECEFFD; --accent-text: #22389E;
  --hero: #14162B; --hero-ink: #FFFFFF; --hero-2: #B8BCCF; --hero-line: #2B2E4A;
  --ok: #1F7A43; --ok-bg: #E4F3EA; --ok-dot: #1F9D55;
  --warn: #7A4A00; --warn-bg: #FFF2D9; --warn-dot: #D98A00; --warn-row: #FFFBF2;
  --bad: #B42318;
  --shadow: 0 1px 2px rgba(20, 22, 43, .05), 0 8px 24px rgba(20, 22, 43, .05);
  --font: "Inter", "Segoe UI", system-ui, sans-serif; --display: "Space Grotesk", "Inter", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101220; --surface: #181B2D; --surface-2: #1D2135; --sunken: #262A41; --line: #2C3049; --line-2: #3A3F5C;
    --ink: #ECEDF6; --ink-2: #A8ACC4; --ink-3: #7B809C;
    --accent: #7C93F5; --accent-ink: #0E1230; --accent-soft: #232A52; --accent-text: #B6C3FF;
    --hero: #0A0C18; --hero-ink: #FFFFFF; --hero-2: #A8ACC4; --hero-line: #262A41;
    --ok: #8BD6A6; --ok-bg: #173225; --ok-dot: #3CC575;
    --warn: #F4C574; --warn-bg: #3A2B10; --warn-dot: #E9A23B; --warn-row: #241E12;
    --bad: #FF8A80;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101220; --surface: #181B2D; --surface-2: #1D2135; --sunken: #262A41; --line: #2C3049; --line-2: #3A3F5C;
  --ink: #ECEDF6; --ink-2: #A8ACC4; --ink-3: #7B809C;
  --accent: #7C93F5; --accent-ink: #0E1230; --accent-soft: #232A52; --accent-text: #B6C3FF;
  --hero: #0A0C18; --hero-ink: #FFFFFF; --hero-2: #A8ACC4; --hero-line: #262A41;
  --ok: #8BD6A6; --ok-bg: #173225; --ok-dot: #3CC575;
  --warn: #F4C574; --warn-bg: #3A2B10; --warn-dot: #E9A23B; --warn-row: #241E12;
  --bad: #FF8A80;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { margin: 0; font-family: var(--display); letter-spacing: -.01em; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1440px; margin: 0 auto; }
.muted { color: var(--ink-2); } .small { font-size: 12.5px; } .num { font-variant-numeric: tabular-nums; }

/* en-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 17px var(--display); }
.brand i { width: 30px; height: 30px; border-radius: 8px; background: var(--hero); display: grid; place-items: center; }
.case { display: flex; flex-direction: column; min-width: 0; }
.case b { font-weight: 600; }
.top-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sync { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.sync.off { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-dot); flex: none; }
.sync.off .dot, .dot.warn { background: var(--warn-dot); }
.dot.info { background: var(--accent); }
.screens { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.screens a { flex: none; text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 13.5px; padding: 7px 12px; border-radius: 999px; }
.screens a:hover { background: var(--surface-2); color: var(--ink); }
.screens a[aria-current="page"] { background: var(--hero); color: var(--hero-ink); }
.demo-note { margin-left: auto; align-self: center; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.demo-note button { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }

main { padding-block: 22px 56px; }
.screen-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px; }
.screen-head h1 { font-size: 28px; }
.screen-head .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent-text); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; padding: 9px 14px; font-weight: 600; font-size: 13px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
.btn[disabled] { background: var(--sunken); color: var(--ink-3); border-color: var(--sunken); cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

/* chiffrage */
.layout { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
.work { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.recap { flex: 1 1 290px; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; gap: 8px; align-items: baseline; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; }
.chip span { font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
.chip[aria-pressed="true"] span { color: var(--hero-2); }
.quick { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.quick label.search { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--accent); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.quick input#quick-add { border: 0; outline: none; flex: 1; min-width: 0; font-size: 15px; background: transparent; }
.result { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 6px; border-top: 1px solid var(--line); }
.result .what { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.co2 { font-size: 12px; color: var(--ok); background: var(--ok-bg); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.sinapps { font-size: 12px; font-weight: 600; color: var(--accent-text); }
.sinapps.missing { color: var(--bad); font-weight: 700; }
.free { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; padding: 10px 6px; border-top: 1px solid var(--line); }
.free .what { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.fld select, .fld input { font-size: 14px; font-weight: 400; color: var(--ink); background: var(--surface); padding: 7px 8px; border: 1px solid var(--line-2); border-radius: 8px; min-width: 0; }
.suggest { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.suggest-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.tag { background: var(--accent-soft); color: var(--accent-text); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; }
.sug-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.sug { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); }
.photo { height: 70px; border-radius: 8px; background: repeating-linear-gradient(135deg, var(--sunken) 0 10px, var(--surface-2) 10px 20px); display: flex; align-items: flex-end; padding: 6px 8px; font-size: 11.5px; color: var(--ink-2); }
.sug .row { display: flex; align-items: center; gap: 8px; margin-top: auto; }
.btn-line { margin-left: auto; background: var(--surface); color: var(--accent-text); border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.btn-line.done { background: var(--ok-bg); color: var(--ok); border-color: transparent; cursor: default; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.lines { min-width: 860px; }
.lines th { text-align: left; color: var(--ink-2); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600; padding: 10px 8px; }
.lines th:first-child, .lines td:first-child { padding-left: 14px; }
.lines th:last-child, .lines td:last-child { padding-right: 14px; }
.lines td { padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.lines .r { text-align: right; }
.lines tr.group td { background: var(--surface-2); font-weight: 700; }
.lines tr.flagged td { background: var(--warn-row); }
.cellname { display: flex; flex-direction: column; gap: 3px; }
.flag { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.flag span { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 600; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 600; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.linked { font-size: 11.5px; color: var(--ink-3); }
input.qty { width: 70px; text-align: right; border: 1px solid transparent; background: var(--sunken); border-radius: 6px; padding: 5px 6px; font-variant-numeric: tabular-nums; }
input.qty:hover, input.qty:focus { border-color: var(--accent); background: var(--surface); }
.drop { border: 1.5px dashed var(--line-2); border-radius: 12px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; background: var(--surface-2); }
.total { background: var(--hero); color: var(--hero-ink); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.total .eyebrow { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--hero-2); font-weight: 600; }
.total .big { font: 700 36px var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.total dl { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; border-top: 1px solid var(--hero-line); padding-top: 12px; }
.total dt { font-size: 12px; color: var(--hero-2); } .total dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.side { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.side h2 { font: 600 14px var(--font); letter-spacing: 0; }
.bar { height: 10px; border-radius: 5px; background: var(--sunken); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--accent); transition: width .3s; }
.bar.dark i { background: var(--ink); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.check .dot { margin-top: 6px; }
.count { min-width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--warn-bg); color: var(--warn); }
.count.zero { background: var(--ok-bg); color: var(--ok); }
.sin { border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
.sin.ok { background: var(--ok-bg); color: var(--ok); } .sin.ko { background: var(--warn-bg); color: var(--warn); }
.sin .dot { margin-top: 5px; } .sin.ok .dot { background: var(--ok-dot); }
.verify { width: 100%; justify-content: center; padding: 14px; font-size: 15px; border-radius: 11px; }
.banner { border-radius: 12px; padding: 12px 14px; font-weight: 500; }
.banner.ok { background: var(--ok-bg); color: var(--ok); } .banner.ko { background: var(--warn-bg); color: var(--warn); }
.banner ul { margin: 6px 0 0; padding-left: 18px; }

/* plan */
.plan-layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.plan-canvas { flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; }
.plan-tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; border-bottom: 1px solid var(--line); align-items: center; }
.tool { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.tool.on { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.plan-svg { padding: 20px; display: flex; justify-content: center; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 20px 20px; border-radius: 0 0 14px 14px; }
.plan-svg svg { width: 100%; max-width: 620px; height: auto; }
.plan-side { flex: 1 1 320px; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 960px) { .plan-side { max-width: none; } }
.dims { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.measures { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.measure { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.measure b { font-size: 18px; font-variant-numeric: tabular-nums; }
.measure.flash b { color: var(--accent-text); }
.linked-row { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; }
.linked-row b { color: var(--accent-text); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* sur place */
.terrain-layout { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; justify-content: center; }
.phone { width: 390px; max-width: 100%; border-radius: 34px; border: 10px solid var(--hero); background: var(--bg); overflow: hidden; display: flex; flex-direction: column; min-height: 760px; box-shadow: var(--shadow); }
.phone .offline { padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
.phone .offline.ko { background: var(--warn-bg); color: var(--warn); } .phone .offline.ok { background: var(--ok-bg); color: var(--ok); }
.phone .offline.ok .dot { background: var(--ok-dot); }
.phone .body { padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.big-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.big-action { border-radius: 14px; padding: 14px 12px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; font-weight: 600; text-align: left; border: 1px solid var(--line); background: var(--surface); }
.big-action.dark { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.thumb { aspect-ratio: 1; max-width: 100%; border-radius: 10px; background: repeating-linear-gradient(135deg, var(--sunken) 0 10px, var(--surface-2) 10px 20px); display: flex; align-items: flex-end; padding: 6px; font-size: 11px; color: var(--ink-2); background-size: cover; background-position: center; overflow: hidden; }
.thumb.real { color: #FFFFFF; text-shadow: 0 1px 2px rgba(0, 0, 0, .6); }
.phone-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px 14px; }
.phone-nav a { min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; color: var(--ink-2); text-decoration: none; }
.phone-nav a.on { color: var(--ink); font-weight: 700; }
.phone-nav a.on::before { content: ""; width: 24px; height: 4px; border-radius: 2px; background: var(--ink); }
.explain { flex: 1 1 280px; max-width: 420px; display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.explain h2 { font-size: 22px; }
.explain ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); }

/* synthèse */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi.dark { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
.kpi .eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); }
.kpi.dark .eyebrow { color: var(--hero-2); }
.kpi b { font: 700 28px var(--display); font-variant-numeric: tabular-nums; }
.syn-layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.syn-main { flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.syn-report { flex: 1 1 340px; max-width: 460px; }
@media (max-width: 960px) { .syn-report { max-width: none; } }
.barrow { display: flex; flex-direction: column; gap: 6px; }
.barrow .lab { display: flex; justify-content: space-between; gap: 10px; }
.page { border: 1px solid var(--line); border-radius: 8px; padding: 22px; background: #FFFFFF; color: #14162B; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 24px rgba(20, 22, 43, .10); font-size: 12px; }
.page .ph { display: flex; justify-content: space-between; gap: 10px; }
.page .rule { border-top: 2px solid #14162B; padding-top: 8px; display: flex; flex-direction: column; gap: 5px; font-variant-numeric: tabular-nums; }
.page .rl { display: flex; justify-content: space-between; gap: 10px; color: #3A3F5A; }
.page .rl.b { color: #14162B; font-weight: 700; margin-top: 4px; }
.timeline { display: flex; flex-direction: column; gap: 8px; }
.timeline div { display: flex; gap: 12px; font-size: 13px; }
.timeline span:first-child { width: 110px; flex: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--hero); color: var(--hero-ink); padding: 11px 16px; border-radius: 10px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast, .bar i { transition: none; } }
</style>

      <div class="case"><b>27FP260071606A01 · Camille Exemple</b><span class="muted small">Dégât des eaux du 02/10/2026 · Appartement, 12 rue des Tilleuls, Lyon 3e</span></div>

<script>
(function () {
  "use strict";
  // ---------- données de la démonstration (fictives) ----------
  const SINAPPS_VAT = [0, 2, 2.1, 4, 5.5, 7, 8.5, 10, 19.6, 20];
  const CLAIMED = 5200;

      '<rect x="' + dx + '" y="' + (y0 + h - 6) + '" width="' + dw + '" height="12" fill="currentColor" style="color:var(--surface)"/>' +
      '<path d="M' + dx + ' ' + (y0 + h) + ' A' + dw + ' ' + dw + ' 0 0 1 ' + (dx + dw) + ' ' + (y0 + h - dw) + '" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--ink-3)"/>' +
      '<line x1="' + dx + '" y1="' + (y0 + h) + '" x2="' + dx + '" y2="' + (y0 + h - dw) + '" stroke="currentColor" stroke-width="1.5" style="color:var(--ink-3)"/>' +
      '<text x="' + (dx + dw / 2) + '" y="' + (y0 + h + 30) + '" text-anchor="middle" font-size="12" fill="currentColor" style="color:var(--ink-2)">' + door.label + ' ' + fr(door.w) + ' × ' + fr(door.h) + ' m</text>' +
      '<rect x="' + (x0 + w - 6) + '" y="' + oy + '" width="12" height="' + ow + '" fill="currentColor" style="color:var(--surface)"/>' +
      '<line x1="' + (x0 + w - 3) + '" y1="' + oy + '" x2="' + (x0 + w - 3) + '" y2="' + (oy + ow) + '" stroke="currentColor" stroke-width="2"/><line x1="' + (x0 + w + 3) + '" y1="' + oy + '" x2="' + (x0 + w + 3) + '" y2="' + (oy + ow) + '" stroke="currentColor" stroke-width="2"/>' +
      '<text x="' + (x0 + w + 22) + '" y="' + (oy + ow / 2) + '" font-size="12" fill="currentColor" style="color:var(--ink-2)" transform="rotate(90 ' + (x0 + w + 22) + ' ' + (oy + ow / 2) + ')" text-anchor="middle">' + other.label + ' ' + fr(other.w) + ' m</text>' +
      '<g style="color:var(--accent)" stroke="currentColor" stroke-width="1.5"><line x1="' + x0 + '" y1="' + (y0 - 26) + '" x2="' + (x0 + w) + '" y2="' + (y0 - 26) + '"/><line x1="' + x0 + '" y1="' + (y0 - 32) + '" x2="' + x0 + '" y2="' + (y0 - 20) + '"/><line x1="' + (x0 + w) + '" y1="' + (y0 - 32) + '" x2="' + (x0 + w) + '" y2="' + (y0 - 20) + '"/>' +
      '<line x1="' + (x0 - 30) + '" y1="' + y0 + '" x2="' + (x0 - 30) + '" y2="' + (y0 + h) + '"/><line x1="' + (x0 - 36) + '" y1="' + y0 + '" x2="' + (x0 - 24) + '" y2="' + y0 + '"/><line x1="' + (x0 - 36) + '" y1="' + (y0 + h) + '" x2="' + (x0 - 24) + '" y2="' + (y0 + h) + '"/></g>' +
      '<rect x="' + (x0 + w / 2 - 36) + '" y="' + (y0 - 38) + '" width="72" height="22" rx="6" fill="currentColor" style="color:var(--accent)"/><text x="' + (x0 + w / 2) + '" y="' + (y0 - 22) + '" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" style="color:var(--accent-ink)">' + fr(r.L) + ' m</text>' +
      '<rect x="' + (x0 - 66) + '" y="' + (y0 + h / 2 - 11) + '" width="72" height="22" rx="6" fill="currentColor" style="color:var(--accent)"/><text x="' + (x0 - 30) + '" y="' + (y0 + h / 2 + 5) + '" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor" style="color:var(--accent-ink)">' + fr(r.W) + ' m</text>' +
      '<text x="' + (x0 + w * 0.32) + '" y="' + (y0 + h * 0.62) + '" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor" style="font-family:\'Space Grotesk\',Inter,sans-serif">' + room + '</text>' +
      '<text x="' + (x0 + w * 0.32) + '" y="' + (y0 + h * 0.62 + 22) + '" text-anchor="middle" font-size="13" fill="currentColor" style="color:var(--ink-2)">' + fr(m.floor) + ' m² au sol</text></svg>';
  }

  function vPlan() {
    const room = S.planRoom, r = S.rooms[room], m = measures(room);
    const linked = all().filter((l) => l.room === room && l.link);
    const tab = (n) => '<button type="button" class="chip" data-act="plan-room" data-room="' + n + '" aria-pressed="' + (room === n) + '">' + n + '</button>';
    const dim = (k, label) => '<label class="fld" for="dim-' + k + '">' + label + '<input id="dim-' + k + '" data-chg="dim" data-k="' + k + '" inputmode="decimal" value="' + fr(r[k]) + '" style="text-align:right"></label>';
    const ms = (label, v, unit) => '<div class="measure"><span class="muted small">' + label + '</span><b>' + fr(v) + ' ' + unit + '</b></div>';
    return '<div class="screen-head"><h1>Plan des pièces</h1><div class="chips">' + tab("Cuisine") + tab("Séjour") + '<button type="button" class="chip" data-act="todo" style="border-style:dashed;color:var(--accent-text)">+ Pièce</button></div>' +
      '<div class="acts"><a class="btn" href="#chiffrage">Retour au chiffrage</a></div></div>' +
      '<div class="plan-layout"><section class="card plan-canvas" aria-label="Plan ' + room + '"><div class="plan-tools"><button type="button" class="tool on">Mur</button><button type="button" class="tool" data-act="todo">Porte</button><button type="button" class="tool" data-act="todo">Fenêtre</button><button type="button" class="tool" data-act="todo">Zone sinistrée</button><span class="muted small" style="margin-left:auto">Modifiez une cote : le chiffrage suit</span></div><div class="plan-svg">' + planSvg(room) + '</div></section>' +
      '<aside class="plan-side"><section class="card side"><h2>Cotes</h2><div class="dims">' + dim("L", "Longueur m") + dim("W", "Largeur m") + dim("H", "Hauteur m") + '</div></section>' +
      '<section class="card side"><h2>Mesures calculées</h2><div class="measures">' + ms("Sol et plafond", m.floor, "m²") + ms("Murs, ouvertures déduites", m.walls, "m²") + ms("Périmètre", m.perimeter, "ml") + ms("Plinthes, portes déduites", m.skirting, "ml") + '</div>' +
      '<span class="muted small">Murs bruts ' + fr(m.wallsGross) + ' m², moins ' + fr(m.open) + ' m² d’ouvertures (' + r.openings.map((o) => o.label.toLowerCase()).join(", ") + ').</span></section>' +
      '<section class="card side"><h2>Lignes liées à ce plan</h2><span class="muted small">Leurs quantités suivent les cotes.</span>' +
      (linked.length ? linked.map((l) => '<div class="linked-row"><span>' + esc(l.name) + '</span><b>' + LINK_LABEL[l.link] + ' · ' + fr(l.qty) + ' ' + l.unit + '</b></div>').join("") : '<span class="small">Aucune ligne liée.</span>') +
      '</section></aside></div>';
  }

  function vTerrain() {
    const lines = all().filter((l) => l.room === "Cuisine");
    const names = ["Plafond", "Mur évier", "Sol", "Plan de travail", "Plinthes", "Arrivée d’eau"];
    const thumbs = S.photos.map((p, i) => '<div class="thumb real" style="background-image:url(' + p.url + ')">Photo ' + (i + 1) + '</div>').join("") + names.map((n) => '<div class="thumb">' + n + '</div>').join("");
    const pending = S.photos.length + 6;
    return '<div class="screen-head"><h1>Sur place</h1><span class="muted">L’écran de l’expert chez l’assuré, sur téléphone ou tablette</span></div>' +
      '<div class="terrain-layout"><div class="phone" aria-label="Écran téléphone">' +
      '<div class="offline ' + (S.online ? "ok" : "ko") + '" role="status"><span class="dot' + (S.online ? "" : " warn") + '" style="margin-top:5px"></span><div><b>' + (S.online ? "Connecté" : "Hors connexion") + '</b><br><span class="small">' + (S.online ? "Photos et lignes envoyées au fil de l’eau." : pending + " photos et " + lines.length + " lignes gardées sur l’appareil. Envoi automatique au retour du réseau.") + '</span></div></div>' +
      '<div class="body"><div><span class="muted small">27FP260071606A01 · Cuisine</span><h2 style="font-size:22px">Relevé sur place</h2></div>' +
      '<div class="big-actions"><label class="big-action dark" for="photo-in"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Ajouter une photo<input type="file" id="photo-in" accept="image/*" hidden></label>' +
      '<button type="button" class="big-action" data-act="todo"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 11a6 6 0 0012 0M12 17v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Dicter une observation</button></div>' +
      '<section><div style="display:flex;justify-content:space-between"><b>Photos</b><span class="muted small">' + pending + '</span></div><div class="thumbs" style="margin-top:8px">' + thumbs + '</div></section>' +
      '<section class="card side" style="box-shadow:none"><span class="muted small" style="font-weight:600">Observation dictée, 10 h 42</span><span>« Auréole au plafond sur un mètre carré environ, faïence décollée derrière l’évier, plinthes gonflées côté séjour. »</span></section>' +
      '<section class="card side" style="box-shadow:none"><div style="display:flex;justify-content:space-between;gap:8px"><b>Chiffrage de la pièce</b><b class="num">' + eur(sum(lines, "ht")) + ' HT</b></div>' +
      lines.map((l) => '<div class="linked-row"><span>' + esc(l.name) + '</span><span class="muted num" style="white-space:nowrap">' + fr(l.qty) + ' ' + l.unit + '</span></div>').join("") + '</section></div>' +
      '<nav class="phone-nav" aria-label="Navigation téléphone"><a class="on" href="#terrain">Relevé</a><a href="#plan">Plan</a><a href="#chiffrage">Chiffrage</a><a href="#synthese">Synthèse</a></nav></div>' +
      '<div class="explain"><h2>Pensé pour le terrain</h2><ul><li>Fonctionne sans réseau : tout est gardé sur l’appareil, puis envoyé au retour du réseau. Essayez le bouton de connexion en haut.</li><li>Les photos rejoignent le dossier ; l’assistant en tire des suggestions de prestations, que l’expert valide.</li><li>Les cotes relevées dessinent le plan et alimentent les quantités.</li><li>Le chiffrage de la pièce se construit pendant la visite.</li></ul>' +
      '<p class="muted small">Dans cette maquette, la photo ajoutée reste dans votre navigateur ; la dictée n’est pas branchée.</p></div></div>';
  }

  function vSynthese() {
    const lines = all(), ttc = sum(lines, "ttc"), vd = sum(lines, "vd"), ratio = Math.round(ttc / CLAIMED * 100);
    const co2 = Math.round(lines.reduce((a, l) => a + (l.co2 || 0) * l.qty, 0));
    const by = (key) => { const m = {}; lines.forEach((l) => { m[l[key]] = r2((m[l[key]] || 0) + l.ttc); }); return Object.keys(m).map((k) => ({ k: k, v: m[k] })).sort((a, b) => b.v - a.v); };
    const bars = (items, dark) => items.map((it) => '<div class="barrow"><div class="lab"><span>' + it.k + '</span><b class="num">' + eur(it.v) + '</b></div><div class="bar' + (dark ? " dark" : "") + '"><i style="width:' + (ttc ? (it.v / ttc * 100).toFixed(1) : 0) + '%"></i></div></div>').join("");
    const rooms = by("room");
    const report = rooms.map((r) => '<div class="rl b"><span>' + r.k + '</span><span>' + eur(r.v) + '</span></div>' + lines.filter((l) => l.room === r.k).map((l) => '<div class="rl"><span>' + esc(l.name) + '</span><span>' + eur(l.ttc) + '</span></div>').join("")).join("");
    const verified = S.status !== "Brouillon";
    return '<div class="screen-head"><h1>Synthèse</h1><span class="pill' + (verified ? " ok" : "") + '">' + S.status + '</span><div class="acts"><button type="button" class="btn" data-act="todo">Télécharger le rapport PDF</button><button type="button" class="btn primary" data-act="send">Envoyer à l’assureur</button></div></div>' +
      '<div class="kpis"><div class="card kpi dark"><span class="eyebrow">Dommages TTC</span><b>' + eur(ttc) + '</b></div><div class="card kpi"><span class="eyebrow">Vétusté déduite</span><b>' + eur(vd) + '</b></div>' +
      '<div class="card kpi"><span class="eyebrow">Part du réclamé</span><b>' + ratio + ' %</b><span class="muted small">de ' + eur(CLAIMED) + ' réclamés</span></div><div class="card kpi"><span class="eyebrow">Empreinte</span><b>' + co2 + ' kg CO2e</b></div></div>' +
      '<div class="syn-layout"><div class="syn-main"><section class="card side"><h2>Montant TTC par pièce</h2>' + bars(rooms, false) + '</section><section class="card side"><h2>Montant TTC par nature Sinapps</h2>' + bars(by("n"), true) + '</section>' +
      '<section class="card side"><h2>Historique de l’estimation</h2><div class="timeline"><div><span>24/11 · 10 h 42</span><span>Relevé sur place : 6 photos, 4 lignes, hors connexion</span></div><div><span>24/11 · 11 h 15</span><span>Devis Réno Services D-2026-0142 importé, 6 lignes contrôlées</span></div>' + (verified ? '<div><span>Aujourd’hui</span><span>Vérification réussie, chiffrage conforme Sinapps</span></div>' : "") + '</div></section></div>' +
      '<aside class="card side syn-report"><div style="display:flex;justify-content:space-between"><h2>Rapport de chiffrage</h2><span class="muted small">Aperçu, page 1</span></div><div class="page"><div class="ph"><b style="font:700 15px var(--display)">Rapport de chiffrage</b><span style="text-align:right;color:#555B77">27FP260071606A01<br>Estimation 1</span></div>' +
      '<span style="color:#555B77">Dégât des eaux du 02/10/2026 · Camille Exemple · 12 rue des Tilleuls, Lyon 3e</span><div class="rule">' + report + '</div><div class="rl b" style="border-top:1px solid #E2E4ED;padding-top:8px"><span>Total TTC</span><span>' + eur(ttc) + '</span></div></div>' +
      '<span class="muted small">Le rapport reprend photos, plan et lignes ; il part avec le chiffrage vers Eureka puis Sinapps.</span></aside></div>';
  }

  // ---------- interactions ----------
  let toastTimer;
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.className = "toast show"; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), 3600); }
  function draft() { if (S.status !== "Brouillon") { S.status = "Brouillon"; } S.errors = null; }
  function addLine(l) { S.lines.push(Object.assign({ id: S.nextId++, vat: 10, vet: 0 }, l)); draft(); }

  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
    const a = el.dataset.act, line = () => S.lines.find((l) => String(l.id) === el.dataset.id);
    if (a === "sync") { S.online = !S.online; toast(S.online ? "Réseau rétabli : modifications envoyées" : "Coupure simulée : les saisies restent sur l’appareil"); }
    else if (a === "reset") { S = initialState(); toast("Démonstration remise à zéro"); }
    else if (a === "room") S.room = el.dataset.room;
    else if (a === "plan-room") S.planRoom = el.dataset.room;
    else if (a === "hide-sug") S.showSug = false;
    else if (a === "accept") { const s = SUGGESTIONS.find((x) => x.key === el.dataset.key); if (S.accepted[s.key]) return; S.accepted[s.key] = true; addLine({ room: "Cuisine", n: s.n, d: s.d, name: s.name, qty: s.qty, unit: s.unit, pu: s.pu, co2: s.co2, source: "Suggestion d’après photo, validée par l’expert" }); toast("Ligne ajoutée : " + s.name); }
    else if (a === "add-cat") { const c = CATALOG[+el.dataset.i], target = S.room === "Toutes" ? "Cuisine" : S.room; addLine({ room: target, n: c.n, d: c.d, name: c.name, link: c.link, qty: c.link ? undefined : 1, unit: c.unit, pu: c.pu, co2: c.co2 }); S.q = ""; toast("Ligne ajoutée : " + c.name); }
    else if (a === "add-free") { const target = S.room === "Toutes" ? "Cuisine" : S.room; addLine({ room: target, n: S.free.n, d: S.free.d, name: S.q.trim(), qty: 1, unit: "FFT", pu: num(S.free.price), co2: 0, source: "Hors bordereau" }); S.q = ""; S.free = { n: "", d: "", price: "" }; toast("Ligne hors bordereau ajoutée"); }
    else if (a === "fix-price") { const l = line(); l.pu = l.bordereau; draft(); toast("Prix aligné sur le bordereau"); }
    else if (a === "fix-vet") { const l = line(); l.vet = l.scale; draft(); toast("Vétusté du barème appliquée"); }
    else if (a === "verify") {
      const lines = all(), errs = checks(lines).filter((c) => c.tone === "warn").map((c) => c.text).concat(sinappsIssues(lines).map((s) => "Sinapps : " + s));
      S.errors = errs; if (!errs.length) { S.status = "Chiffrages vérifiés"; toast("Chiffrages vérifiés"); } window.scrollTo({ top: 0, behavior: "smooth" });
    }
    else if (a === "send") { toast(S.status === "Brouillon" ? "Vérifiez d’abord l’estimation depuis l’écran Chiffrage" : "Maquette : l’envoi vers Eureka et Sinapps n’est pas branché"); return; }
    else if (a === "import") { toast("Maquette : l’import de devis fonctionne déjà dans l’application Angular"); return; }
    else if (a === "todo") { toast("Maquette : cette action n’est pas encore simulée"); return; }
    render();
  });

  document.addEventListener("input", (ev) => {
    if (ev.target.id === "quick-add") { S.q = ev.target.value; document.getElementById("qa-results").innerHTML = vResults(); }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target, k = t.dataset && t.dataset.chg;
    if (t.id === "photo-in" && t.files && t.files[0]) {
      const r = new FileReader(); r.onload = () => { S.photos.unshift({ url: r.result }); render(); toast("Photo ajoutée au relevé"); }; r.readAsDataURL(t.files[0]); return;
    }
    if (!k) return;
    if (k === "qty") {
      const v = num(t.value), l = S.lines.find((x) => String(x.id) === t.dataset.id);
      if (!(v > 0)) { toast("La quantité doit être un nombre supérieur à 0"); render(); return; }
      l.qty = v; l.link = null; draft();
    } else if (k === "dim") {
      const v = num(t.value);
      if (!(v > 0 && v < 100)) { toast("La cote doit être un nombre de mètres valide"); render(); return; }
      S.rooms[S.planRoom][t.dataset.k] = v; draft(); toast("Cote modifiée : les quantités liées ont suivi");
    } else if (k === "free-n") { S.free.n = t.value; S.free.d = ""; }
    else if (k === "free-d") S.free.d = t.value;
    else if (k === "free-p") S.free.price = t.value;
    const keep = t.id; render();
    const again = keep && document.getElementById(keep); if (again && (k === "free-n" || k === "free-d" || k === "free-p")) again.focus();
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.matches && ev.target.matches("input[data-chg]")) ev.target.blur(); });
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  render();
})();
</script>
